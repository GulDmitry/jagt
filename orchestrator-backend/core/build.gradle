plugins {
    id 'java-library'
}

// No Spring and no Lombok, deliberately: the records and the rules are exercised without a container, and the
// build is what stops that becoming a promise. Jackson is here because the record IS the state file's format.
dependencies {
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'tools.jackson.core:jackson-databind'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
