plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// No Spring and no Lombok, deliberately: the records and the rules are exercised without a container, and the
// build is what stops that becoming a promise. Jackson is here because the record IS the state file's format.
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.20'
    implementation 'tools.jackson.core:jackson-databind:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring resolves constructor parameter names reflectively and has no bytecode fallback since 6.1.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
