# bootRun is a never-ending task: Gradle's rich console pins a bogus
# "80% EXECUTING" progress bar under the app logs forever. Plain console
# prints logs like a normal foreground process.
org.gradle.console=plain

# Worktrees run the same suite, so an unchanged one is a cache hit instead of a second full run.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Error Prone's javac exports on the daemon itself: compiling in-process instead of a forked worker JVM per module
# and worktree, which the daemon keeps alive for hours.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED

# Library versions every module reads. Declared HERE rather than as root `ext`: a subproject reading a root
# property is an implicit parent lookup, which Gradle 10 refuses.
springBootVersion=4.1.1
lombokVersion=1.18.48
errorProneVersion=2.50.0
nullAwayVersion=0.14.2
jqwikVersion=1.10.2
