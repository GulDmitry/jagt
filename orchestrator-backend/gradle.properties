# bootRun is a never-ending task: Gradle's rich console pins a bogus
# "80% EXECUTING" progress bar under the app logs forever. Plain console
# prints logs like a normal foreground process.
org.gradle.console=plain

# Worktrees run the same suite, so an unchanged one is a cache hit instead of a second full run.
org.gradle.caching=true

# Library versions every module reads. Declared HERE rather than as root `ext`: a subproject reading a root
# property is an implicit parent lookup, which Gradle 10 refuses.
springBootVersion=4.1.0
lombokVersion=1.18.46
