# DEFAULTS ONLY — built into the jar, committed, and not the file you edit. Yours is `jagt.yml` at the
# repository root: copy `jagt.yml.dist`, which carries every key below with what it means, and write only what
# you change. It overrides this file key by key and survives every build.
server:
  # Change this and mcp_client.js needs MCP_SERVER_URL to match.
  port: 8290
  # Loopback: the board needs no password to deploy, close a task or start an agent. Set 0.0.0.0 only if you
  # accept that everyone who can reach the port can do all of it.
  address: 127.0.0.1

spring:
  application:
    name: jagt-orchestrator
  main:
    banner-mode: "off"
  web:
    resources:
      cache:
        cachecontrol:
          # Revalidate, not "never cache": unchanged assets still answer 304.
          no-cache: true

logging:
  # No console threshold: nothing owns the terminal any more, so Boot's default is what a human wants —
  # a server saying nothing at all is indistinguishable from one that died.
  file:
    name: ${LOG_FILE:jagt-backend.log}
  pattern:
    # `%kvp` is the point: the values are key-value pairs, not part of the message, and a pattern without it
    # prints the event and drops every field — including the file pattern, which is what a blanked
    # `structured.format.file` falls back to. Spelled out rather than derived from Boot's, whose
    # `${X:-default}` placeholders are logback's syntax and would be resolved by Spring first.
    # Quoted values (`%kvp` defaults to DOUBLE): most of them contain spaces, and unquoted they run into
    # the next key.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%12.12t]){faint} %clr(%-40.40logger{39}){cyan}\
      \ %clr(:){faint} %m %kvp%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%12.12t] %-40.40logger{39} : %m %kvp%n%wEx"
  structured:
    format:
      # The console is what a human reads while jagt runs; blank this to make the file readable too.
      file: ecs

orchestrator:
  # Blank = auto-detected by walking up from the launch directory.
  root: ${ORCHESTRATOR_ROOT:}
  config-file: ${ORCHESTRATOR_CONFIG_FILE:}
  state-file: ${ORCHESTRATOR_STATE_FILE:}
  # macos | linux — selects the notifier and the kitty driver.
  platform: macos
  # kitty-command: kitty   # override the kitty binary if not on PATH
  # kitty-font-size: 13    # viewer font size; blank keeps kitty.conf's own (default 11)
  # Any CLI launcher, resolved on PATH and in the usual install dirs; the worktree path is appended.
  # `open -a` will NOT do: it activates the app without opening the passed directory.
  editor-command: ["idea"]
  # editor-command: ["/Applications/IntelliJ IDEA.app/Contents/MacOS/idea"]   # no `idea` launcher installed
  # Two paths are appended: <left> <right>. Any difftool takes them — ["difft"], ["code", "--diff"].
  editor-diff-command: ["idea", "diff"]
  # `agent.cli` selects the runtime; the rest of `agent` is read live. One key cannot be a word to Spring and a
  # section to jagt in the same file, which is why the choice sits INSIDE the section it is about.
  # agent:
  #   cli: codex     # claude | codex. A Codex worktree runs against its own CODEX_HOME, so your ~/.codex
  # codex:           # servers are not there.
  #   command: codex
  # Also used by the headless reads, which stay Claude whichever agent runs the tasks.
  claude:
    command: claude
  # Initial prompt every spawned sub-agent starts with (otherwise the session idles).
  agent-prompt: >-
    You are the sub-agent for this worktree. Read task_context.md, set your status to IN_PROGRESS
    via update_agent_status, and start working on the task. The orchestrator rules are already in your
    context — follow them. Work autonomously, but do NOT commit, push, or open a merge request on your
    own — leave ALL changes UNCOMMITTED so the human reviews your working tree; committing happens ONLY
    when task_context.md later instructs it (that is the human's `ship`). When done and verified, set
    status REVIEW_PENDING.
  # The one-shot headless reads. They inherit YOUR MCP servers; jagt hardcodes no server or path.
  assistant:
    # Do NOT narrow to `project`: the call runs from a temp dir, where that scope loads zero servers.
    setting-sources: user,project,local
    # Blank inherits your own model; the reads are mechanical enough for the cheapest one.
    model: haiku
    # Nothing can answer a permission prompt in a headless call, and a blocked tool fails silently.
    permission-mode: bypassPermissions
    # allowed-tools: mcp__your-jira-mcp,mcp__your-gitlab-mcp   # takes precedence over permission-mode
    # Declare the servers instead of inheriting them — one path, or the JSON itself. Settings still load, so a
    # declared file's ${ENV} placeholders and the model resolve as usual; only the server list is pinned.
    # Measured cold: it costs MORE than inheriting, which rides the prompt cache the human's own sessions keep warm.
    # mcp-config: /path/to/mcp-servers.json
  # Opt-in for RAM-constrained setups; disabling an LSP plugin buys memory and costs the agent its
  # code intelligence.
  # agent-disabled-plugins:
  #   - jdtls-lsp@claude-plugins-official
  #   - php-lsp@claude-plugins-official
  #   - oh-my-claudecode@omc
  # A bare name is resolved on PATH and then in the known install dirs; an absolute path is not portable.
  tmux-command: tmux
  # A suite passes false, so a run leaves no kitty window behind.
  open-terminal-window: true
  # Refuse to start when a part of the installation is missing, instead of failing at the click that needs it.
  # A suite that boots the application passes false: what these check is the machine, and a runner is not one.
  startup-checks: true
  watchdog:
    stale-after: 5m
