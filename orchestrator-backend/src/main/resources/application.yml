server:
  # Change this and mcp_client.js needs MCP_SERVER_URL to match.
  port: 8290

spring:
  application:
    name: jagt-orchestrator
  main:
    banner-mode: "off"
  web:
    resources:
      cache:
        cachecontrol:
          # Revalidate, not "never cache": unchanged assets still answer 304.
          no-cache: true

logging:
  # No console threshold here: `ui/ConsoleLogging` decides it per surface, and this would outrank that.
  file:
    name: ${LOG_FILE:jagt-backend.log}
  structured:
    format:
      # The console is what a human reads while jagt runs; blank this to make the file readable too.
      file: ecs

orchestrator:
  # web | tui | both.
  ui: web
  # Blank = auto-detected by walking up from the launch directory.
  root: ${ORCHESTRATOR_ROOT:}
  config-file: ${ORCHESTRATOR_CONFIG_FILE:}
  state-file: ${ORCHESTRATOR_STATE_FILE:}
  # macos | linux — selects the notifier and the terminal driver.
  platform: macos
  # kitty | warp. Both run over tmux, so agents persist either way.
  terminal: kitty
  # kitty-command: kitty   # override the kitty binary if not on PATH
  # kitty-font-size: 13    # viewer font size; blank keeps kitty.conf's own (default 11)
  # Any CLI launcher; the worktree path is appended. `open -a` will NOT do: it activates the app
  # without opening the passed directory.
  editor-command: ["/Applications/IntelliJ IDEA.app/Contents/MacOS/idea"]
  # Two paths are appended: <left> <right>.
  editor-diff-command: ["/Applications/IntelliJ IDEA.app/Contents/MacOS/idea", "diff"]
  # claude | codex. A Codex worktree runs against its own CODEX_HOME, so your ~/.codex servers are not there.
  # agent: claude
  # codex:
  #   command: codex
  # Also used by the headless reads, which stay Claude whichever agent runs the tasks.
  claude-command: claude
  # Initial prompt every spawned sub-agent starts with (otherwise the session idles).
  agent-prompt: >-
    You are the sub-agent for this worktree. Read task_context.md, set your status to IN_PROGRESS
    via update_agent_status, and start working on the task. Follow the rules in AGENTS.md. Work
    autonomously, but do NOT commit, push, or open a merge request on your own — leave ALL changes
    UNCOMMITTED so the human reviews your working tree; committing happens ONLY when task_context.md
    later instructs it (that is the human's `ship`). When done and verified, set status REVIEW_PENDING.
  # The one-shot headless reads. They inherit YOUR MCP servers; jagt hardcodes no server or path.
  assistant:
    # Do NOT narrow to `project`: the call runs from a temp dir, where that scope loads zero servers.
    setting-sources: user,project,local
    # Blank inherits your own model; the reads are mechanical enough for the cheapest one.
    model: haiku
    # Nothing can answer a permission prompt in a headless call, and a blocked tool fails silently.
    permission-mode: bypassPermissions
    # allowed-tools: mcp__your-jira-mcp,mcp__your-gitlab-mcp   # takes precedence over permission-mode
  # Blank type = not wired, and the review sweep falls back to a paid headless read.
  code-host:
    type: ${CODE_HOST_TYPE:}          # gitlab (the only implementation today); blank = disabled
    base-url: ${CODE_HOST_URL:}       # https://gitlab.example.com — URLs are only read under this prefix
    token: ${CODE_HOST_TOKEN:}        # read-only API token; keep it in the environment, never in a file
  # Opt-in for RAM-constrained setups; disabling an LSP plugin buys memory and costs the agent its
  # code intelligence.
  # agent-disabled-plugins:
  #   - jdtls-lsp@claude-plugins-official
  #   - php-lsp@claude-plugins-official
  #   - oh-my-claudecode@omc
  # A bare name is resolved on PATH and then in the known install dirs; an absolute path is not portable.
  tmux-command: tmux
  # Smoke tests pass false, so a run leaves no window behind.
  open-warp-window: true
  watchdog:
    stale-after: 5m
