plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.jagt'
version = '0.2.0'
description = 'Stateful multi-agent dev orchestrator (macOS / Warp / Claude Code)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Master control terminal: a full-screen TUI (Lanterna). One screen shows the dashboard, the command
    // output, and the input line together — Lanterna owns a back-buffer and re-lays-out + full-redraws on
    // resize, so there is no scroll-region/ghost/prompt-anchor fragility (the JLine pinned-Status approach
    // could not survive terminal resize; see CLAUDE.md). Pure-Java, cross-platform.
    implementation 'com.googlecode.lanterna:lanterna:3.1.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The end-to-end matrix lives in its own source set, NOT in `test`: it drives real git worktrees and real
// tmux windows, so it needs tmux + git on the machine and is far slower than the unit gate. Keeping it out of
// `test`/`check` means `./gradlew test` stays the fast, hermetic gate it is today.
// Run it with `./gradlew e2eTest` (see TaskFlowMatrixTest for what a combination asserts).
sourceSets {
    e2e {
        java.srcDirs = ['src/e2e/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// The Linux DRIVERS against the real binaries (notify-send over a session bus, kitty on an X display).
// Its own source set because it needs an environment no developer machine has by default and macOS cannot
// have at all — `scripts/linux-suite.sh` provides it in a container. NOT in `check`.
sourceSets {
    linuxTest {
        java.srcDirs = ['src/linuxTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // A bare `./gradlew linuxDriverTest` on a dev machine would fail for the environment, not for the code.
    onlyIf {
        boolean inContainer = System.getenv('JAGT_IN_CONTAINER') != null
        if (!inContainer) {
            logger.lifecycle('Skipping linuxDriverTest: run it via scripts/linux-suite.sh (needs Linux + Xvfb + dbus).')
        }
        inContainer
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end task-flow matrix (needs git + tmux; creates and removes throwaway worktrees).'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

// Spring Shell reads command parameter names/metadata reflectively — needs -parameters,
// otherwise @Option/@Argument never attach and commands reject any argument token.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

// The Master shell reads stdin; Gradle does not forward it to bootRun unless asked.
// --enable-native-access silences JLine's restricted-method warnings on the clean shell console.
tasks.named('bootRun') {
    standardInput = System.in
    jvmArgs('--enable-native-access=ALL-UNNAMED')
}

// So `java -jar` gets the same native-access grant without a command-line flag.
// Fixed, version-independent archive name so the run command never changes across releases:
// always `java -jar build/libs/jagt.jar` (the version still lives in `version` above and in the manifest).
tasks.named('bootJar') {
    archiveFileName = 'jagt.jar'
    manifest {
        attributes('Enable-Native-Access': 'ALL-UNNAMED')
    }
}
