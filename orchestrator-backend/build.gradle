plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.jawo'
version = '0.2.0'
description = 'Stateful multi-agent dev orchestrator (macOS / Warp / Claude Code)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Master control terminal: a hand-rolled JLine REPL. (Spring Shell 4 was tried, but its
    // annotation arg-binding wouldn't attach @Argument/@Option to component-scanned @Command
    // methods — every command rejected argument tokens. JLine gives full control over tokenization.)
    implementation 'org.jline:jline:3.30.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Spring Shell reads command parameter names/metadata reflectively — needs -parameters,
// otherwise @Option/@Argument never attach and commands reject any argument token.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

// The Master shell reads stdin; Gradle does not forward it to bootRun unless asked.
// --enable-native-access silences JLine's restricted-method warnings on the clean shell console.
tasks.named('bootRun') {
    standardInput = System.in
    jvmArgs('--enable-native-access=ALL-UNNAMED')
}

// So `java -jar` gets the same native-access grant without a command-line flag.
tasks.named('bootJar') {
    manifest {
        attributes('Enable-Native-Access': 'ALL-UNNAMED')
    }
}
