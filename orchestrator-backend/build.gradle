plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.jagt'
version = '0.7.0'
description = 'Stateful multi-agent dev orchestrator (macOS / kitty / Claude Code)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    implementation project(':usecase')
    implementation project(':adapter')
    implementation project(':surface')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Every ring is built the same way: one toolchain, one repository list, and the reflective parameter names
// Spring needs. Declared once here rather than copied into four build files.
subprojects {
    apply plugin: 'java'

    // Versions come from gradle.properties, which every project reads on its own.
    dependencies {
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        // The annotation processor resolves outside the platform, so its version is named here rather than in
        // four build files.
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '2g'
        // Relative on purpose: an absolute path is a task input that differs per worktree, so nothing
        // would ever be a cache hit across them.
        systemProperty 'logging.file.name', 'build/test-logs/suite.log'
        environment 'GIT_AUTHOR_NAME', 'jagt tests'
        environment 'GIT_AUTHOR_EMAIL', 'tests@example.com'
        environment 'GIT_COMMITTER_NAME', 'jagt tests'
        environment 'GIT_COMMITTER_EMAIL', 'tests@example.com'
    }
}

tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Never the developer's own log file: `activity` reads that file back, so fixture tasks would come out as
    // work jagt did unattended. Relative on purpose: an absolute path is a task input that differs per
    // worktree, so nothing would ever be a cache hit across them.
    systemProperty 'logging.file.name', projectDir.toPath()
            .relativize(layout.buildDirectory.file('test-logs/suite.log').get().asFile.toPath()).toString()
    // The suite commits in throwaway repositories, which have no committer identity of their own.
    environment 'GIT_AUTHOR_NAME', 'jagt tests'
    environment 'GIT_AUTHOR_EMAIL', 'tests@example.com'
    environment 'GIT_COMMITTER_NAME', 'jagt tests'
    environment 'GIT_COMMITTER_EMAIL', 'tests@example.com'
    maxHeapSize = '2g'
}

// Only the hermetic suite: the others are order-dependent by construction.
tasks.named('test') {
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    // Oversubscribed: the wall clock goes on blocked subprocesses, not on computing.
    systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '3'
}

// `build` rewrites jagt.jar in place (same inode), and a JVM running from that path then fails on the next
// class it loads. A new file per build, pointed at by a symlink, is never the inode a running process holds.
tasks.register('stageJar') {
    description = 'Stages build/libs/jagt-run-<stamp>.jar and points jagt-run.jar at it — run THAT.'
    group = 'application'
    dependsOn tasks.named('bootJar')
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile.toPath()
        def built = libs.resolve('jagt.jar')
        def stamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date())
        def staged = libs.resolve("jagt-run-${stamp}.jar")
        java.nio.file.Files.copy(built, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def link = libs.resolve('jagt-run.jar')
        java.nio.file.Files.deleteIfExists(link)
        java.nio.file.Files.createSymbolicLink(link, staged.fileName)
        // Deleting a staged jar a running JVM holds is harmless — the inode outlives the name.
        libs.toFile().listFiles({ f -> f.name ==~ /jagt-run-.*\.jar/ } as java.io.FileFilter)
                .sort { it.name }
                .reverse()
                .drop(3)
                .each { it.delete() }
        logger.lifecycle("staged ${staged.fileName} — run: java -jar build/libs/jagt-run.jar")
    }
}

// Needs git + tmux on the machine, so it stays out of `test`/`check`, which must remain hermetic.
sourceSets {
    e2e {
        java.srcDirs = ['src/e2e/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Spends tokens through the assistant's own CLI, so it is asked for by name. NOT in `check`.
sourceSets {
    promptEval {
        java.srcDirs = ['src/promptEval/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Needs Linux binaries and a display, which `scripts/linux-suite.sh` provides in a container. NOT in `check`.
sourceSets {
    linuxTest {
        java.srcDirs = ['src/linuxTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Needs a browser, so it stays out of `check`, which must remain hermetic.
sourceSets {
    boardTest {
        java.srcDirs = ['src/boardTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

dependencies {
    // Playwright brings its OWN Chromium, downloaded on first run: the suite asks the host for no browser, so
    // a Mac and a runner execute the same thing. The shared libraries it links against come from
    // scripts/linux-test-deps.sh.
    boardTestImplementation 'com.microsoft.playwright:playwright:1.62.0'
}

tasks.register('playwrightChromium', JavaExec) {
    description = 'Installs the Chromium the board suite drives (a no-op once it is in the local cache).'
    group = 'verification'
    classpath = sourceSets.boardTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('boardTest', Test) {
    description = 'Drives the web board in a headless Chromium.'
    group = 'verification'
    testClassesDirs = sourceSets.boardTest.output.classesDirs
    classpath = sourceSets.boardTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('playwrightChromium')
    // Left to itself the client installs every browser it supports — a quarter of a gigabyte for a suite that
    // drives one.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    shouldRunAfter tasks.named('test')
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // Gated on CAPABILITY, never on which harness is running it, and it names what is missing.
    onlyIf {
        List<String> missing = []
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            missing << 'Linux'
        }
        ['notify-send', 'kitty', 'dbus-monitor', 'pgrep'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!System.getenv('DISPLAY')) {
            missing << 'DISPLAY (start it with scripts/with-linux-desktop.sh)'
        }
        if (missing) {
            logger.lifecycle("Skipping linuxDriverTest — missing: ${missing.join(', ')}."
                    + " On a Mac: scripts/linux-suite.sh runs it in a container.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end task-flow matrix (needs git + tmux; creates and removes throwaway worktrees).'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.register('promptEval', Test) {
    description = 'Maps operator phrasings onto the grammar through the real assistant (spends tokens).'
    group = 'verification'
    testClassesDirs = sourceSets.promptEval.output.classesDirs
    classpath = sourceSets.promptEval.runtimeClasspath
    useJUnitPlatform()
    // Gated on the binary that answers, and it names what is missing rather than failing every row on it.
    onlyIf {
        boolean present = (System.getenv('PATH') ?: '').split(File.pathSeparator)
                .any { dir -> dir && new File(dir, 'claude').canExecute() }
        if (!present) {
            logger.lifecycle('Skipping promptEval — no `claude` on PATH; the rows are answered by the'
                    + ' assistant configured in jagt.yml, through its own CLI.')
        }
        present
    }
    shouldRunAfter tasks.named('test')
}

// What these prove is the MACHINE — or a model — and no such state is in a cache key: a restored result would
// come back green without anything having run.
['e2eTest', 'boardTest', 'linuxDriverTest', 'promptEval'].each { name ->
    tasks.named(name) {
        outputs.cacheIf { false }
        outputs.upToDateWhen { false }
    }
}

// Spring resolves constructor parameter names reflectively and has no bytecode fallback since 6.1.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

// Version-independent archive name, so the documented run command survives every release.
tasks.named('bootJar') {
    archiveFileName = 'jagt.jar'
}
