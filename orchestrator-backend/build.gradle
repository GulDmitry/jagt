buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'net.ltgt.errorprone' version '5.2.0' apply false
    id 'jagt.conventions' apply false
    id 'jagt.parallel-tests' apply false
    id 'jagt.pitest' apply false
    id 'jagt.stage-jar' apply false
    id 'jagt.suites' apply false
    id 'jagt.doc-inputs' apply false
    id 'jagt.evals' apply false
    id 'jagt.uncached-suites' apply false
    id 'jagt.suite-stats' apply false
    id 'jagt.sbom' apply false
    id 'jagt.fitness' apply false
    id 'jagt.tests-for' apply false
    id 'fitness' apply false
}

group = 'dev.jagt'
version = '0.25.0'
description = 'Local orchestration of AI coding-agent CLI sessions across isolated Git worktrees'

dependencies {
    implementation project(':core')
    implementation project(':usecase')
    implementation project(':adapter')
    implementation project(':surface')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'fitness:junit'
    testImplementation 'com.networknt:json-schema-validator:3.0.8'
    testImplementation 'com.github.victools:jsonschema-generator:5.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

apply plugin: 'jagt.conventions'
apply plugin: 'jagt.pitest'
apply plugin: 'jagt.stage-jar'
apply plugin: 'jagt.parallel-tests'
apply plugin: 'jagt.suites'
apply plugin: 'jagt.doc-inputs'
apply plugin: 'jagt.evals'
apply plugin: 'jagt.uncached-suites'
apply plugin: 'jagt.suite-stats'
apply plugin: 'jagt.sbom'
apply plugin: 'jagt.fitness'
apply plugin: 'jagt.tests-for'

tasks.named('test') {
    dependsOn gradle.includedBuild('fitness').task(':test'), gradle.includedBuild('build-logic').task(':test')
}
tasks.named('check') { dependsOn gradle.includedBuild('fitness').task(':check'), 'fitness', 'checkScope' }
