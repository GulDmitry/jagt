plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.jagt'
version = '0.2.0'
description = 'Stateful multi-agent dev orchestrator (macOS / Warp / Claude Code)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Master control terminal: a full-screen TUI (Lanterna). One screen shows the dashboard, the command
    // output, and the input line together — Lanterna owns a back-buffer and re-lays-out + full-redraws on
    // resize, so there is no scroll-region/ghost/prompt-anchor fragility (the JLine pinned-Status approach
    // could not survive terminal resize; see CLAUDE.md). Pure-Java, cross-platform.
    implementation 'com.googlecode.lanterna:lanterna:3.1.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The suite drives REAL git (worktrees, merges, reverts, a diff snapshot built with commit-tree), and some
    // of those commits are made by jagt INSIDE a fixture's repo, which has no identity of its own. Without
    // this the tests pass only on a machine whose global config happens to have one and fail on any CI runner
    // — which is exactly what happened: git exits non-zero, and a deploy then reported a MERGE CONFLICT that
    // did not exist. Declaring the identity here makes the suite independent of the machine.
    environment 'GIT_AUTHOR_NAME', 'jagt tests'
    environment 'GIT_AUTHOR_EMAIL', 'tests@example.com'
    environment 'GIT_COMMITTER_NAME', 'jagt tests'
    environment 'GIT_COMMITTER_EMAIL', 'tests@example.com'
}

// `./gradlew build` rewrites build/libs/jagt.jar IN PLACE (same inode), so a jagt started from that path keeps
// reading a file whose content changed: already-loaded classes work, every class loaded afterwards dies with
// NoClassDefFoundError (the board renders, /status and /stats answer 500). This task stages a copy — and stages
// a NEW FILE every time, with jagt-run.jar as a symlink to the latest, because a fixed staged name has exactly
// the same problem the moment you re-stage while an instance is running (which is how this was found the second
// time). A running JVM holds the inode it started from, so a new build cannot touch it. RunningJarWatch reports
// the situation if something rewrites a jar anyway.
tasks.register('stageJar') {
    description = 'Stages build/libs/jagt-run-<stamp>.jar and points jagt-run.jar at it — run THAT.'
    group = 'application'
    dependsOn tasks.named('bootJar')
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile.toPath()
        def built = libs.resolve('jagt.jar')
        def stamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date())
        def staged = libs.resolve("jagt-run-${stamp}.jar")
        java.nio.file.Files.copy(built, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def link = libs.resolve('jagt-run.jar')
        java.nio.file.Files.deleteIfExists(link)
        java.nio.file.Files.createSymbolicLink(link, staged.fileName)
        // Keep the last few: deleting a staged jar a JVM still runs from is harmless (the inode outlives the
        // name), but an unbounded pile of 20 MB jars is not.
        libs.toFile().listFiles({ f -> f.name ==~ /jagt-run-.*\.jar/ } as java.io.FileFilter)
                .sort { it.name }
                .reverse()
                .drop(3)
                .each { it.delete() }
        logger.lifecycle("staged ${staged.fileName} — run: java -jar build/libs/jagt-run.jar")
    }
}

// The end-to-end matrix lives in its own source set, NOT in `test`: it drives real git worktrees and real
// tmux windows, so it needs tmux + git on the machine and is far slower than the unit gate. Keeping it out of
// `test`/`check` means `./gradlew test` stays the fast, hermetic gate it is today.
// Run it with `./gradlew e2eTest` (see TaskFlowMatrixTest for what a combination asserts).
sourceSets {
    e2e {
        java.srcDirs = ['src/e2e/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// The Linux DRIVERS against the real binaries (notify-send over a session bus, kitty on an X display).
// Its own source set because it needs an environment no developer machine has by default and macOS cannot
// have at all — `scripts/linux-suite.sh` provides it in a container. NOT in `check`.
sourceSets {
    linuxTest {
        java.srcDirs = ['src/linuxTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // Guarded by CAPABILITY, never by "which harness am I in": the same task has to run inside our container,
    // on a GitHub/GitLab Linux runner and on a Linux developer's box, and skip on macOS — where the binaries it
    // drives do not exist. It names what is missing instead of failing for the environment.
    onlyIf {
        List<String> missing = []
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            missing << 'Linux'
        }
        ['notify-send', 'kitty', 'dbus-monitor', 'pgrep'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!System.getenv('DISPLAY')) {
            missing << 'DISPLAY (start it with scripts/with-linux-desktop.sh)'
        }
        if (missing) {
            logger.lifecycle("Skipping linuxDriverTest — missing: ${missing.join(', ')}."
                    + " On a Mac: scripts/linux-suite.sh runs it in a container.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end task-flow matrix (needs git + tmux; creates and removes throwaway worktrees).'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

// Spring Shell reads command parameter names/metadata reflectively — needs -parameters,
// otherwise @Option/@Argument never attach and commands reject any argument token.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

// The Master shell reads stdin; Gradle does not forward it to bootRun unless asked.
// --enable-native-access silences JLine's restricted-method warnings on the clean shell console.
tasks.named('bootRun') {
    standardInput = System.in
    jvmArgs('--enable-native-access=ALL-UNNAMED')
}

// So `java -jar` gets the same native-access grant without a command-line flag.
// Fixed, version-independent archive name so the run command never changes across releases:
// always `java -jar build/libs/jagt.jar` (the version still lives in `version` above and in the manifest).
tasks.named('bootJar') {
    archiveFileName = 'jagt.jar'
    manifest {
        attributes('Enable-Native-Access': 'ALL-UNNAMED')
    }
}
