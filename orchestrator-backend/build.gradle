plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'net.ltgt.errorprone' version '5.1.1' apply false
    id 'jagt.conventions' apply false
    id 'jagt.parallel-tests' apply false
    id 'jagt.pitest' apply false
    id 'jagt.stage-jar' apply false
    id 'jagt.suites' apply false
    id 'jagt.doc-inputs' apply false
    id 'jagt.stand' apply false
    id 'jagt.evals' apply false
    id 'jagt.uncached-suites' apply false
}

group = 'dev.jagt'
version = '0.19.0'
description = 'Local orchestration of AI coding-agent CLI sessions across isolated Git worktrees'

dependencies {
    implementation project(':core')
    implementation project(':usecase')
    implementation project(':adapter')
    implementation project(':surface')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'net.sourceforge.pmd:pmd-java:7.28.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply plugin: 'jagt.conventions'
apply plugin: 'jagt.pitest'
apply plugin: 'jagt.stage-jar'
apply plugin: 'jagt.parallel-tests'
apply plugin: 'jagt.suites'
apply plugin: 'jagt.doc-inputs'
apply plugin: 'jagt.stand'
apply plugin: 'jagt.evals'
apply plugin: 'jagt.uncached-suites'
