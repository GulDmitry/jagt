import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'net.ltgt.errorprone' version '5.1.1' apply false
    id 'info.solidsoft.pitest' version '1.19.0' apply false
}

group = 'dev.jagt'
version = '0.10.4'
description = 'Local orchestration of AI coding-agent CLI sessions across isolated Git worktrees'

dependencies {
    implementation project(':core')
    implementation project(':usecase')
    implementation project(':adapter')
    implementation project(':surface')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Every project is built the same way: one toolchain, one repository list, and the reflective parameter
// names Spring needs. Declared once here, root assembly included, rather than copied into five build files.
allprojects {
    apply plugin: 'java'
    apply plugin: 'net.ltgt.errorprone'

    // Versions come from gradle.properties, which every project reads on its own. The centre is IN here: a
    // ring pinned below the versions the jar ships would have its tests pass against a library nothing runs.
    dependencies {
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        implementation 'org.jspecify:jspecify'
        errorprone "com.google.errorprone:error_prone_core:${errorProneVersion}"
        errorprone "com.uber.nullaway:nullaway:${nullAwayVersion}"
    }

    // A tool writing its state relative to the working directory lands it in a resources folder, gitignored
    // and therefore invisible in a diff — and everything there is packaged into the jar and served on
    // loopback. Every ring is guarded, not just the one that serves the board.
    tasks.named('processResources') {
        exclude '**/.*', '**/.*/**'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
        // NullAway alone: Error Prone's own checks are a separate decision.
        options.errorprone {
            disableAllChecks = true
            enabled = name == 'compileJava'
            error('NullAway')
            option('NullAway:AnnotatedPackages', 'dev.jagt')
            option('NullAway:JSpecifyMode', 'true')
        }
    }

    ext.tmuxDirOf = { Task task ->
        new File(System.getProperty('java.io.tmpdir'),
                'jagt-tmux-' + Integer.toHexString("${task.project.rootDir}:${task.path}".hashCode()))
    }

    ext.forkedTestEnv = { Task task ->
        // The suite commits in throwaway repositories, which have no committer identity of their own.
        task.environment 'GIT_AUTHOR_NAME', 'jagt tests'
        task.environment 'GIT_AUTHOR_EMAIL', 'tests@example.com'
        task.environment 'GIT_COMMITTER_NAME', 'jagt tests'
        task.environment 'GIT_COMMITTER_EMAIL', 'tests@example.com'
        // Every tmux a test starts lives on a server of its own. Under the temp dir, not `build/`: a socket path
        // past 104 characters is refused, and a worktree path alone is most of that.
        def tmuxDir = tmuxDirOf(task)
        task.environment 'TMUX_TMPDIR', tmuxDir.absolutePath
        task.environment.remove('TMUX')
        task.doFirst { tmuxDir.mkdirs() }
    }

    // Provisioning a worktree trusts it in the config Claude reads; the suites that log in as the human need theirs.
    tasks.matching { it.name in ['test', 'pitest'] }.configureEach { task ->
        task.environment 'CLAUDE_CONFIG_DIR', task.temporaryDir.absolutePath
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '2g'
        // Mockito's inline mock maker appends to the bootstrap classpath, which a shared archive warns about on every fork.
        jvmArgs '-Xshare:off'
        // Never the developer's own log file: `activity` reads that file back, so a fixture task would come
        // out as work jagt did unattended. Relative on purpose too — an absolute path is a task input that
        // differs per worktree, so nothing would ever be a cache hit across them.
        systemProperty 'logging.file.name', 'build/test-logs/suite.log'
        systemProperty 'logging.master.name', 'build/test-logs/master.log'
        forkedTestEnv(it)
    }

    afterEvaluate {
        (tasks.withType(Test).names.toList() + (tasks.names.contains('pitest') ? ['pitest'] : [])).each { testName ->
            def tmuxDir = tmuxDirOf(tasks.named(testName).get())
            def stop = tasks.register("${testName}StopTmux", Exec) {
                environment 'TMUX_TMPDIR', tmuxDir.absolutePath
                environment.remove('TMUX')
                commandLine 'sh', '-c', 'tmux kill-server 2>/dev/null; rm -rf "$TMUX_TMPDIR"; true'
            }
            tasks.named(testName) { finalizedBy stop }
        }
    }
}

// Everything but the centre: `:core` must not have Lombok even on its processor path, so the build refuses it
// rather than a comment asking nobody to add it. The annotation processor resolves outside the platform, so
// its version is named here.
configure(allprojects - project(':core')) {
    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }
}

// A report asked for by name, read by a human: never in `test`, `check` or `build`, and no threshold.
def usecaseGitClasses = ['GitWorktrees', 'GitDeploy', 'WorktreeInspection', 'GitStates', 'GitCommands', 'WorktreeHooks', 'DiffCheckouts']
    .collect { "dev.jagt.orchestrator.service.${it}" }

configure(allprojects - project(':')) {
    apply plugin: 'info.solidsoft.pitest'
    def pitestTargets = providers.gradleProperty('pitestTargets').map { it.split(',').toList() }
    // Only `:adapter`'s real-git tests run the `:usecase` classes listed above, so `:adapter` mutates them and `:usecase` does not.
    def ownTargets = project.path == ':adapter' ? ['dev.jagt.orchestrator.adapter.*'] + usecaseGitClasses : ['dev.jagt.*']

    pitest {
        pitestVersion = '1.30.1'
        junit5PluginVersion = '1.2.3'
        targetClasses = pitestTargets.orElse(ownTargets)
        targetTests = ['dev.jagt.*']
        if (project.path == ':usecase') {
            excludedClasses = usecaseGitClasses.collectMany { [it, it + '$*'] }
        }
        if (project.path == ':adapter') {
            additionalMutableCodePaths = project(':usecase').sourceSets.main.output.classesDirs.files
        }
        threads = Runtime.runtime.availableProcessors()
        outputFormats = ['HTML', 'XML']
        timestampedReports = false
        jvmArgs = ['-Xshare:off', '-Duser.language=tr']
    }

    tasks.named('pitest') { forkedTestEnv(it) }
}

tasks.register('printVersion') {
    def version = project.version.toString()
    doLast {
        println version
    }
}

// Only the hermetic suite: the others are order-dependent by construction. Every module's, not just this
// project's — `:adapter`'s alone is most of the gate, and it spends its wall clock waiting on git.
allprojects {
    tasks.named('test') {
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
        systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
        systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
        systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
        // Oversubscribed: the wall clock goes on blocked subprocesses, not on computing.
        systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '3'
        // Turkish lowercases I to a dotless ı: a case change on the default locale fails here, not on a user's machine.
        systemProperty 'user.language', 'tr'
    }
}

// `build` rewrites jagt.jar in place (same inode), and a JVM running from that path then fails on the next
// class it loads. A new file per build, pointed at by a symlink, is never the inode a running process holds.
tasks.register('stageJar') {
    description = 'Stages build/libs/jagt-run-<stamp>.jar and points jagt-run.jar at it — run THAT.'
    group = 'application'
    dependsOn tasks.named('bootJar')
    def libsDir = layout.buildDirectory.dir('libs')
    doLast {
        def libs = libsDir.get().asFile.toPath()
        def built = libs.resolve('jagt.jar')
        def stamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date())
        def staged = libs.resolve("jagt-run-${stamp}.jar")
        java.nio.file.Files.copy(built, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def link = libs.resolve('jagt-run.jar')
        java.nio.file.Files.deleteIfExists(link)
        java.nio.file.Files.createSymbolicLink(link, staged.fileName)
        // Deleting a staged jar a running JVM holds is harmless — the inode outlives the name.
        libs.toFile().listFiles({ f -> f.name ==~ /jagt-run-.*\.jar/ } as java.io.FileFilter)
                .sort { it.name }
                .reverse()
                .drop(3)
                .each { it.delete() }
        logger.lifecycle("staged ${staged.fileName} — run: java -jar build/libs/jagt-run.jar")
    }
}

// Needs git + tmux on the machine, so it stays out of `test`/`check`, which must remain hermetic.
sourceSets {
    e2e {
        java.srcDirs = ['src/e2e/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Spends tokens through the assistant's own CLI, so it is asked for by name. NOT in `check`.
sourceSets {
    promptEval {
        java.srcDirs = ['src/promptEval/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Needs Linux binaries and a display, which `scripts/linux-suite.sh` provides in a container. NOT in `check`.
sourceSets {
    linuxTest {
        java.srcDirs = ['src/linuxTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Needs a browser, so it stays out of `check`, which must remain hermetic.
sourceSets {
    masterEval {
        java.srcDirs = ['src/masterEval/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

sourceSets {
    boardTest {
        java.srcDirs = ['src/boardTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

dependencies {
    // Playwright brings its OWN Chromium, downloaded on first run: the suite asks the host for no browser, so
    // a Mac and a runner execute the same thing. The shared libraries it links against come from
    // scripts/linux-test-deps.sh.
    boardTestImplementation 'com.microsoft.playwright:playwright:1.63.0'
}

tasks.register('playwrightChromium', JavaExec) {
    description = 'Installs the Chromium the board suite drives (a no-op once it is in the local cache).'
    group = 'verification'
    classpath = sourceSets.boardTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('boardTest', Test) {
    description = 'Drives the web board in a headless Chromium.'
    group = 'verification'
    testClassesDirs = sourceSets.boardTest.output.classesDirs
    classpath = sourceSets.boardTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('playwrightChromium')
    // Left to itself the client installs every browser it supports — a quarter of a gigabyte for a suite that
    // drives one.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    shouldRunAfter tasks.named('test')
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // Gated on CAPABILITY, never on which harness is running it, and it names what is missing.
    onlyIf { task ->
        List<String> missing = []
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            missing << 'Linux'
        }
        ['notify-send', 'kitty', 'dbus-monitor', 'pgrep'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!System.getenv('DISPLAY')) {
            missing << 'DISPLAY (start it with scripts/with-linux-desktop.sh)'
        }
        if (missing) {
            task.logger.lifecycle("Skipping linuxDriverTest — missing: ${missing.join(', ')}."
                    + " On a Mac: scripts/linux-suite.sh runs it in a container.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

// TextBudgetTest and ConfigReferenceTest read files that live outside every source set: without declaring it
// the task stays UP-TO-DATE while a document grows past its budget, and the suite is green over a breach.
tasks.named('test') {
    inputs.files(fileTree(projectDir.parentFile) {
        include '*.md'
        include 'docs/**/*.md'
        include 'openspec/specs/**/*.md'
        include 'orchestrator-backend/*/src/main/resources/prompts/*.md'
        include '.claude/rules/*.md'
        include 'orchestrator-backend/*/src/main/java/**/*.java'
        include 'orchestrator-backend/src/main/java/**/*.java'
        include 'jagt.yml.dist'
        include 'master-brief.md.dist'
    }).withPropertyName('documents').withPathSensitivity(PathSensitivity.RELATIVE)
    // Outside the tree above: a file tree drops `.gitignore` by default.
    inputs.file(new File(projectDir.parentFile, '.gitignore')).withPropertyName('gitignore')
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end task-flow matrix (needs git + tmux; creates and removes throwaway worktrees).'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    // A run killed mid-suite skips its @TempDir cleanup: its leftovers land here, and the next run wipes them.
    def scratch = temporaryDir
    systemProperty 'java.io.tmpdir', scratch.absolutePath
    doFirst {
        scratch.deleteDir()
        scratch.mkdirs()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('masterEval', Test) {
    description = 'Reads the shipped Master brief against rounds whose verdict is known (spends tokens, minutes).'
    group = 'verification'
    testClassesDirs = sourceSets.masterEval.output.classesDirs
    classpath = sourceSets.masterEval.runtimeClasspath
    useJUnitPlatform()
    // -PmasterBrief and -PmasterModel read another brief or model against the same rounds, to compare cost.
    ['masterBrief': 'masterEval.brief', 'masterModel': 'masterEval.model'].each { property, key ->
        if (project.hasProperty(property)) {
            systemProperty key, project.property(property)
        }
    }
    // Gated on CAPABILITY, and it names what is missing rather than failing every round on it.
    def brief = file('../master-brief.md.dist')
    onlyIf { task ->
        List<String> missing = []
        ['claude', 'tmux', 'git'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!brief.exists()) {
            missing << 'master-brief.md.dist'
        }
        if (missing) {
            task.logger.lifecycle("Skipping masterEval — missing: ${missing.join(', ')}.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('promptEval', Test) {
    description = 'Maps operator phrasings onto the grammar through the real assistant (spends tokens).'
    group = 'verification'
    testClassesDirs = sourceSets.promptEval.output.classesDirs
    classpath = sourceSets.promptEval.runtimeClasspath
    useJUnitPlatform()
    // Gated on the binary that answers, and it names what is missing rather than failing every row on it.
    onlyIf { task ->
        boolean present = (System.getenv('PATH') ?: '').split(File.pathSeparator)
                .any { dir -> dir && new File(dir, 'claude').canExecute() }
        if (!present) {
            task.logger.lifecycle('Skipping promptEval — no `claude` on PATH; the rows are answered by the'
                    + ' assistant configured in jagt.yml, through its own CLI.')
        }
        present
    }
    shouldRunAfter tasks.named('test')
}

// What these prove is the MACHINE — or a model — and no such state is in a cache key: a restored result would
// come back green without anything having run.
['e2eTest', 'boardTest', 'linuxDriverTest', 'promptEval', 'masterEval'].each { name ->
    tasks.named(name) {
        outputs.cacheIf { false }
        outputs.upToDateWhen { false }
    }
}

// Version-independent archive name, so the documented run command survives every release.
tasks.named('bootJar') {
    archiveFileName = 'jagt.jar'
}
