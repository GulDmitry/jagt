plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    api project(':core')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'tools.jackson.core:jackson-databind'
    // Already on the runtime classpath through Boot; named here because THIS module parses jagt.yml
    // itself — the config is re-read on every access, which Spring's own one-shot binding cannot do.
    implementation 'org.yaml:snakeyaml'
    implementation 'commons-io:commons-io:2.22.0'
    testFixturesImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter'
    testFixturesCompileOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testFixturesCompileOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 0139: the jqwik properties are the slowest class of the gate; in a task of their own they run beside the other
// modules' suites instead of ahead of them. `test` is finalized by it, so every run of `test` still runs them.
tasks.named('test', Test) {
    useJUnitPlatform { excludeEngines 'jqwik' } // jqwik runs in propertyTest
    finalizedBy 'propertyTest'
}

tasks.register('propertyTest', Test) {
    group = 'verification'
    description = 'Runs the jqwik property tests, split from test to keep them off its critical path.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines 'jqwik' }
    systemProperty 'jqwik.tries.default', '200'
}

tasks.named('check') { dependsOn 'propertyTest' }
