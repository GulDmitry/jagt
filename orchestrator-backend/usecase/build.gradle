plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    api project(':core')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'tools.jackson.core:jackson-databind'
    // Already on the runtime classpath through Boot; named here because THIS module parses jagt.yml
    // itself — the config is re-read on every access, which Spring's own one-shot binding cannot do.
    implementation 'org.yaml:snakeyaml'
    implementation 'commons-io:commons-io:2.22.0'
    testFixturesImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter'
    testFixturesCompileOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testFixturesCompileOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
