plugins {
    id 'java-library'
}

// A tool writing its state relative to the working directory lands it in `static/`, gitignored and therefore
// invisible in a diff — and everything there is packaged into the jar and served on loopback.
processResources {
    exclude '**/.*', '**/.*/**'
}

dependencies {
    api project(':core')
    api project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.googlecode.lanterna:lanterna:3.1.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
