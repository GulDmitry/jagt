plugins {
    id 'java-library'
    id 'jagt.resource-guard'
}

dependencies {
    api project(':core')
    api project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.yaml:snakeyaml'
    implementation 'org.commonmark:commonmark:0.31.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.31.0'
    testImplementation testFixtures(project(':usecase'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    from('../../board') {
        exclude 'node_modules/**', 'test/**', 'package*.json', 'eslint.config.js', 'jsconfig.json', '.prettierignore',
                '.c8rc.json', '.jscpd.json', 'stryker.config.mjs', 'coverage/**', '.stryker-tmp/**'
        into 'static'
    }
    from('../../contracts') {
        include 'openapi.yaml'
        into 'contracts'
    }
}
