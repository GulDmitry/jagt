<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jagt</title>
  <!-- favicon.svg is the source; the .ico/.png fallbacks are generated from it (see its comment). -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>jagt</h1>
  <span id="waiting" class="waiting" hidden></span>
  <span id="auto-review" class="chip" data-tip="whether the unattended review poll runs"></span>
  <span id="jobs-pulse" class="chip" hidden></span>
  <span class="grow"></span>
  <label class="control">sort
    <select id="sort">
      <option value="active">last active</option>
      <option value="alias">alias</option>
      <option value="title">title</option>
    </select>
  </label>
  <label class="control checkbox" data-tip="only tasks whose next move is yours"><input type="checkbox" id="mine"> waiting on me</label>
  <button id="resume-task">Resume</button>
  <button id="open-palette" data-tip="⌘K / Ctrl-K — say what you want in words">Ask</button>
  <span id="reports"></span>
  <span id="live" class="dot" data-tip="live updates"></span>
</header>

<form id="launch">
  <input id="ref" name="ref" placeholder="ABC-42 or a ticket URL" autocomplete="off" required>
  <!-- Several picked = one task, one agent session, a worktree in each. -->
  <select id="project" name="project" multiple size="1" data-tip="one project, or several for work that spans them"></select>
  <input id="base-branch" name="baseBranch" placeholder="base branch (optional)" autocomplete="off">
  <label class="checkbox" data-tip="the agent writes a plan and waits for your go-ahead before touching code"><input type="checkbox" id="plan"> plan first</label>
  <input id="notes" name="notes" placeholder="extra instructions for the agent (optional)" autocomplete="off">
  <button type="submit" class="primary" data-tip="cut a worktree per project, start one agent session and brief it">Start</button>
  <span id="launch-state" class="muted"></span>
</form>

<form id="resume" hidden>
  <input id="resume-url" placeholder="review-request URL (…/merge_requests/42 or …/pull/42)" autocomplete="off" required>
  <button type="submit" class="primary">Resume</button>
  <span id="resume-state" class="muted"></span>
</form>

<form id="palette" hidden>
  <input id="ask" list="ask-options" placeholder="a command (ship a1), or say it in words"
         autocomplete="off" required>
  <datalist id="ask-options"></datalist>
  <button type="submit" class="primary">Run</button>
  <span id="palette-state" class="muted"></span>
</form>

<dialog id="report">
  <header class="report-head">
    <strong id="report-title"></strong>
    <span class="grow"></span>
    <button id="close-report" autofocus>Close</button>
  </header>
  <pre id="report-body"></pre>
</dialog>

<dialog id="terminal">
  <header class="report-head">
    <strong id="terminal-title"></strong>
    <span class="grow"></span>
    <span class="muted">click inside to talk to the agent</span>
    <button id="close-terminal" autofocus>Close</button>
  </header>
  <iframe id="terminal-frame" title="agent terminal"></iframe>
</dialog>

<main id="board"></main>
<p id="empty" class="empty" hidden>No tasks. The row above starts one — the same thing
  <code>do ABC-42</code> does in the console.</p>
<button id="show-log" class="log" hidden data-tip="only the first line fits here — click for every message this session"></button>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
