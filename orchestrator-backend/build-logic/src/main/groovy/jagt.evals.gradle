// One harness per kind of role, each over `roles/<id>/eval/*.yml`: a checker reads its brief against deploys, the
// arbiter against rounds, triage against stops. -Prole=<id> picks the role; -ProleBrief and -ProleModel read another brief or
// model against the same cases, to compare cost. -ProleCli=opencode reads at -PopencodeEndpoint on -ProleModel.
def evalRole = (project.findProperty('role') ?: 'acceptance').toString()
def evalIsArbiter = evalRole == 'master'
def evalIsTriage = evalRole == 'triage'
def evalSet = evalIsArbiter ? sourceSets.masterEval : evalIsTriage ? sourceSets.triageEval : sourceSets.acceptanceEval
def evalCli = (project.findProperty('roleCli') ?: 'claude').toString()
def evalOnOpenCode = evalCli == 'opencode'
tasks.register('roleEval', Test) {
    description = 'Reads a role\'s shipped brief against cases whose verdict is known, -Prole=<id> (spends tokens, minutes).'
    group = 'verification'
    testClassesDirs = evalSet.output.classesDirs
    classpath = evalSet.runtimeClasspath
    useJUnitPlatform()
    String harness = evalIsArbiter ? 'master' : evalIsTriage ? 'triage' : 'acceptance'
    String testClass = evalIsArbiter ? 'MasterVerdictEvalShard' : 'AcceptanceVerdictEvalShard'
    // A review is one task per tick, so cases go in parallel only across JVMs: one per shard class, each a full context.
    int shards = evalIsTriage ? 1 : (project.findProperty('evalShards') ?: (evalIsArbiter ? '6' : '3')) as int
    if (shards < 1 || shards > 6) {
        throw new GradleException("-PevalShards ${shards} must be between 1 and 6, the shard classes there are.")
    }
    maxParallelForks = shards
    forkEvery = 1
    systemProperty "${harness}Eval.shards", shards
    systemProperty 'eval.role', evalRole
    if (!evalIsArbiter) {
        testLogging.showStandardStreams = true
    }
    testLogging.exceptionFormat = 'full'
    reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/roleEval-${evalRole}")
    reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/roleEval-${evalRole}")
    filter {
        if (evalIsTriage) {
            includeTestsMatching '*TriageEvalTest'
        } else {
            (0..<shards).each { includeTestsMatching "*${testClass}${it}Test" }
        }
    }
    ['evalRuns': 'eval.runs', 'evalPasses': 'eval.passes'].each { property, key ->
        if (project.hasProperty(property)) {
            systemProperty key, project.property(property)
        }
    }
    def brief = file("../roles/${evalRole}/brief.md.dist")
    systemProperty "${harness}Eval.brief", project.findProperty('roleBrief') ?: brief.path
    if (project.hasProperty('roleModel')) {
        systemProperty "${harness}Eval.model", project.property('roleModel')
    }
    if (evalOnOpenCode) {
        systemProperty 'orchestrator.opencode.endpoint', project.findProperty('opencodeEndpoint') ?: ''
        systemProperty 'orchestrator.opencode.model', project.findProperty('roleModel') ?: ''
        systemProperty "orchestrator.opencode.reads.${evalIsTriage ? 'master' : evalRole}", ''
    }
    Map<String, String> retired = ['masterBrief': '-Prole=master -ProleBrief', 'masterModel': '-Prole=master -ProleModel',
                                   'acceptanceBrief': '-Prole=acceptance -ProleBrief', 'acceptanceModel': '-Prole=acceptance -ProleModel',
                                   'masterShards': '-PevalShards', 'acceptanceShards': '-PevalShards'].findAll { name, use ->
        project.hasProperty(name)
    }
    boolean roleNamed = project.hasProperty('role')
    boolean openCodeNamed = project.findProperty('opencodeEndpoint') && project.findProperty('roleModel')
    File evalCases = file("../roles/${evalRole}/eval")
    doFirst {
        if (retired) {
            throw new GradleException("roleEval no longer reads ${retired.keySet().collect { '-P' + it }.join(', ')}: use "
                    + retired.values().unique().join(', ') + '.')
        }
        if (!roleNamed) {
            throw new GradleException('roleEval needs -Prole=<id>: a role with roles/<id>/eval/*.yml.')
        }
        if (!evalCases.isDirectory()) {
            throw new GradleException("roles/${evalRole}/eval holds no cases: a role is evaluated over its eval/*.yml.")
        }
        if (!(evalCli in ['claude', 'opencode'])) {
            throw new GradleException("-ProleCli ${evalCli} must be claude or opencode.")
        }
        if (evalOnOpenCode && evalIsArbiter) {
            throw new GradleException('-ProleCli=opencode reads a checker or a stop: the Master\'s round has its own reader.')
        }
        if (evalOnOpenCode && !openCodeNamed) {
            throw new GradleException('-ProleCli=opencode needs -PopencodeEndpoint=<base url> and -ProleModel=<the model it serves>.')
        }
    }
    // Gated on CAPABILITY, and it names what is missing rather than failing every case on it.
    onlyIf { task ->
        List<String> missing = []
        (evalIsArbiter ? ['claude', 'tmux', 'git'] : [evalCli, 'git']).each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!brief.exists()) {
            missing << brief.name
        }
        if (missing) {
            task.logger.lifecycle("Skipping roleEval -Prole=${evalRole} — missing: ${missing.join(', ')}.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('promptEval', Test) {
    description = 'Maps operator phrasings onto the grammar through the real assistant (spends tokens).'
    group = 'verification'
    testClassesDirs = sourceSets.promptEval.output.classesDirs
    classpath = sourceSets.promptEval.runtimeClasspath
    useJUnitPlatform()
    // -PlocalEndpoint and -PlocalModel read the rows through assistant.local (0135) instead of the cloud; -PlocalTimeout is optional.
    String localEndpoint = (project.findProperty('localEndpoint') ?: '').toString()
    String localModel = (project.findProperty('localModel') ?: '').toString()
    boolean onLocal = !localEndpoint.isEmpty() || !localModel.isEmpty()
    // The rows are independent calls, so they run side by side; one local server queues them past the per-row timeout,
    // so local rows run one at a time. -PevalParallelism sizes the pool.
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', project.findProperty('evalParallelism') ?: (onLocal ? '1' : '6')
    ['evalRuns': 'eval.runs', 'evalPasses': 'eval.passes'].each { property, key ->
        if (project.hasProperty(property)) {
            systemProperty key, project.property(property)
        }
    }
    if (onLocal) {
        systemProperty 'orchestrator.assistant.local.endpoint', localEndpoint
        systemProperty 'orchestrator.assistant.local.model', localModel
        systemProperty 'orchestrator.assistant.local.kinds', 'COMMAND_MAP'
        systemProperty 'eval.local', 'true'
        if (project.hasProperty('localTimeout')) {
            systemProperty 'orchestrator.assistant.local.timeout', project.property('localTimeout')
        }
    }
    // Gated on what answers, and it names what is missing rather than failing every row on it.
    onlyIf { task ->
        List<String> missing = []
        if (onLocal) {
            if (localEndpoint.isEmpty() || localModel.isEmpty()) {
                missing << '-PlocalEndpoint and -PlocalModel together'
            } else {
                try {
                    def connection = new URL(localEndpoint.replaceAll('/+$', '') + '/models').openConnection()
                    connection.connectTimeout = 3000
                    connection.readTimeout = 3000
                    if (connection.responseCode >= 400) {
                        missing << "an endpoint answering at ${localEndpoint} (HTTP ${connection.responseCode})"
                    }
                } catch (IOException unreachable) {
                    missing << "an endpoint answering at ${localEndpoint} (${unreachable.class.simpleName})"
                }
            }
        } else if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                .any { dir -> dir && new File(dir, 'claude').canExecute() }) {
            missing << 'claude on PATH (the rows are answered by the assistant configured in jagt.yml, through its own CLI)'
        }
        if (missing) {
            task.logger.lifecycle("Skipping promptEval — missing: ${missing.join('; ')}.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

// Each case of a model eval appends its outcome to one gitignored file a later run reads; nothing else reads it.
tasks.named('promptEval') {
    systemProperty 'eval.suite', 'promptEval'
    systemProperty 'eval.stats', file('eval-stats.jsonl').absolutePath
    systemProperty 'eval.model', project.hasProperty('localModel') ? "local/${project.property('localModel')}" : 'default'
    systemProperty 'eval.brief.file', file('adapter/src/main/java/dev/jagt/orchestrator/adapter/assistant/HeadlessClaudeCommandAssistant.java').path
}
// `acceptanceEval` is a new stats key: the trend recorded as `qaEval` does not carry over.
tasks.named('roleEval') {
    systemProperty 'eval.suite', evalIsArbiter ? 'masterEval' : evalIsTriage ? 'triageEval' : 'acceptanceEval'
    systemProperty 'eval.stats', file('eval-stats.jsonl').absolutePath
    systemProperty 'eval.model', (evalOnOpenCode ? 'opencode/' : '') + (project.findProperty('roleModel') ?: 'default')
    systemProperty 'eval.brief.file', project.findProperty('roleBrief')
            ?: file("../roles/${evalRole}/brief.md.dist").path
}
