import java.time.Duration

// Every project is built the same way: one toolchain, one repository list, and the reflective parameter
// names Spring needs. Declared once here, root assembly included, rather than copied into five build files.
allprojects {
    apply plugin: 'java'
    apply plugin: 'net.ltgt.errorprone'

    // Versions come from gradle.properties, which every project reads on its own. The centre is IN here: a
    // ring pinned below the versions the jar ships would have its tests pass against a library nothing runs.
    dependencies {
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        implementation 'org.jspecify:jspecify'
        errorprone "com.google.errorprone:error_prone_core:${errorProneVersion}"
        errorprone "com.uber.nullaway:nullaway:${nullAwayVersion}"
    }

    // A tool writing its state relative to the working directory lands it in a resources folder, gitignored
    // and therefore invisible in a diff — and everything there is packaged into the jar and served on
    // loopback. Every ring is guarded, not just the one that serves the board.
    tasks.named('processResources') {
        exclude '**/.*', '**/.*/**'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
        // NullAway alone: Error Prone's own checks are a separate decision.
        options.errorprone {
            disableAllChecks = true
            enabled = name == 'compileJava'
            error('NullAway')
            option('NullAway:AnnotatedPackages', 'dev.jagt')
            option('NullAway:JSpecifyMode', 'true')
        }
    }

    ext.tmuxDirOf = { Task task ->
        new File(System.getProperty('java.io.tmpdir'),
                'jagt-tmux-' + Integer.toHexString("${task.project.rootDir}:${task.path}".hashCode()))
    }

    ext.forkedTestEnv = { Task task ->
        // The suite commits in throwaway repositories, which have no committer identity of their own.
        task.environment 'GIT_AUTHOR_NAME', 'jagt tests'
        task.environment 'GIT_AUTHOR_EMAIL', 'tests@example.com'
        task.environment 'GIT_COMMITTER_NAME', 'jagt tests'
        task.environment 'GIT_COMMITTER_EMAIL', 'tests@example.com'
        // Every tmux a test starts lives on a server of its own. Under the temp dir, not `build/`: a socket path
        // past 104 characters is refused, and a worktree path alone is most of that.
        def tmuxDir = tmuxDirOf(task)
        task.environment 'TMUX_TMPDIR', tmuxDir.absolutePath
        task.environment.remove('TMUX')
        task.doFirst { tmuxDir.mkdirs() }
        // Walking up from the working directory would reach the human's own stores.
        def testRoot = task.project.layout.buildDirectory.dir("test-root/${task.name}").get().asFile
        task.environment 'ORCHESTRATOR_ROOT', testRoot.absolutePath
        // A booted app reads its briefs and cases from the root, so the root holds the shipped ones.
        def shipped = task.project.rootProject.file('..')
        task.doFirst {
            testRoot.mkdirs()
            shipped.listFiles().findAll { it.name.endsWith('.dist') }.each {
                java.nio.file.Files.copy(it.toPath(), new File(testRoot, it.name).toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            new File(shipped, 'roles').eachFileRecurse(groovy.io.FileType.FILES) {
                File target = new File(testRoot, shipped.toPath().relativize(it.toPath()).toString())
                target.parentFile.mkdirs()
                java.nio.file.Files.copy(it.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }

    // Provisioning a worktree trusts it in the config Claude reads; the suites that log in as the human need theirs.
    tasks.matching { it.name in ['test', 'pitest'] }.configureEach { task ->
        task.environment 'CLAUDE_CONFIG_DIR', task.temporaryDir.absolutePath
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '2g'
        systemProperty 'junit.platform.discovery.issue.severity.critical', 'WARNING'
        // Mockito's inline mock maker appends to the bootstrap classpath, which a shared archive warns about on every fork.
        jvmArgs '-Xshare:off'
        // Never the developer's own log file: `activity` reads that file back, so a fixture task would come
        // out as work jagt did unattended. Relative on purpose too — an absolute path is a task input that
        // differs per worktree, so nothing would ever be a cache hit across them.
        systemProperty 'logging.file.name', 'build/test-logs/suite.log'
        systemProperty 'logging.master.name', 'build/test-logs/master.log'
        forkedTestEnv(it)
    }

    // 0139: an investigation states its own length with -PrunMinutes; nothing else may outrun the ceiling.
    def runMinutes = providers.gradleProperty('runMinutes').orElse(providers.gradleProperty('suiteCeilingMinutes'))
    tasks.withType(Test).configureEach {
        timeout = runMinutes.map { Duration.ofMinutes(it as long) }
    }

    afterEvaluate {
        (tasks.withType(Test).names.toList() + (tasks.names.contains('pitest') ? ['pitest'] : [])).each { testName ->
            def tmuxDir = tmuxDirOf(tasks.named(testName).get())
            def stop = tasks.register("${testName}StopTmux", Exec) {
                environment 'TMUX_TMPDIR', tmuxDir.absolutePath
                environment.remove('TMUX')
                commandLine 'sh', rootProject.file('gradle/stop-test-tmux.sh').absolutePath
            }
            tasks.named(testName) { finalizedBy stop }
        }
    }
}

// Lombok's set is decided in docs/decisions/0107; lombok.config refuses the rest. The annotation processor
// resolves outside the platform, so its version is named here.
allprojects {
    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }
}
