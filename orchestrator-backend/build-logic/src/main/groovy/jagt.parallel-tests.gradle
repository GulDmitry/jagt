// Only the hermetic suite: the others are order-dependent by construction. Every module's, not just this
// project's — `:adapter`'s alone is most of the gate, and it spends its wall clock waiting on git.
allprojects {
    tasks.named('test') {
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
        systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
        systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
        systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
        // One thread per core: factors 2 and 3 bought no wall time, only load.
        systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', project.findProperty('testFactor') ?: '1'
        // The gate never reaches the developer's own terminal: a booted context finds no tmux and no kitty to run.
        systemProperty 'orchestrator.tmux.command', 'jagt-test-no-tmux'
        systemProperty 'orchestrator.kitty-command', 'jagt-test-no-kitty'
        environment.remove('KITTY_LISTEN_ON')
        environment.remove('KITTY_WINDOW_ID')
    }
}

// build-logic/test-jvm.properties on every Test task of every project; pitest reads `testJvmProperties` too.
def testJvmProperties = new Properties()
testJvmProperties.load(new StringReader(providers.fileContents(layout.settingsDirectory.file('build-logic/test-jvm.properties')).asText.get()))

allprojects {
    ext.testJvmProperties = testJvmProperties
    tasks.withType(Test).configureEach {
        testJvmProperties.each { key, value -> systemProperty key.toString(), value.toString() }
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it instanceof Test }.each { Test task ->
        def missing = testJvmProperties.findAll { key, value -> !task.allJvmArgs.contains("-D${key}=${value}".toString()) }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("${task.path} does not carry the shared test JVM properties ${missing}: build-logic/test-jvm.properties")
        }
    }
}
