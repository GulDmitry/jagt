// Spends model tokens on a local stand, so it is asked for by name. NOT in `check`.
sourceSets {
    stand {
        java.srcDirs = ['src/stand/java']
        resources.srcDirs = ['src/stand/resources']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

def standJar = rootProject.file('build/libs/jagt-run.jar').absolutePath
def standRepo = rootProject.file('..').absolutePath

tasks.named('test') {
    systemProperty 'stand.repo', standRepo
}

def standBase = System.getProperty('java.io.tmpdir')
def standReport = layout.buildDirectory.file('stand/report.txt').get().asFile

tasks.register('standTest', Test) {
    description = 'Blood Games: real sessions and the Master try to break into jagt on a local stand (spends tokens).'
    group = 'verification'
    testClassesDirs = sourceSets.stand.output.classesDirs
    classpath = sourceSets.stand.runtimeClasspath
    useJUnitPlatform {
        if (project.hasProperty('modelfree')) {
            excludeTags 'model' // -Pmodelfree skips the runs that spend model tokens
        }
    }
    // Each run owns its root, port and tmux server, so runs go side by side: StandSlots caps the live runs at
    // -PstandParallelism=N (6), since 37 processes at once broke startup; the JUnit pool is wide so containers never starve runs.
    def standEngine = (project.findProperty('engine') ?: 'compose').toString()
    def standParallelism = (project.findProperty('standParallelism') ?: (standEngine == 'kind' ? '2' : '6')).toString()
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '8'
    systemProperty 'stand.parallelism', standParallelism
    // Absolute time budgets hold on the reference machine only; a shared runner sets -Pbudgets=false.
    systemProperty 'stand.budgets', project.findProperty('budgets') ?: 'true'
    systemProperty 'stand.base', standBase
    systemProperty 'stand.jar', standJar
    systemProperty 'stand.repo', standRepo
    systemProperty 'stand.engine', standEngine
    // -Prunner=<label> names the machine class a timing series belongs to; the server scenario writes them to stand.timings.
    systemProperty 'stand.runner', project.findProperty('runner') ?: 'local'
    systemProperty 'stand.timings', layout.buildDirectory.file('stand/timings.json').get().asFile.absolutePath
    // -PstandRuns=N repeats each run; -Pengine=host|compose|kind picks where jagt runs; -Pscenario=, -Pmodes= and -Pmutations= select by comma list; -Pseed= picks a mutation.
    systemProperty 'stand.runs', project.findProperty('standRuns') ?: '1'
    ['scenario', 'modes', 'mutations', 'seed'].each { key -> systemProperty "stand.${key}", project.findProperty(key) ?: '' }
    systemProperty 'stand.report', standReport.absolutePath
    // A run starts the staged jar, so a replay checks the frame as built now.
    dependsOn ':stageJar', 'standImage'
    doFirst { standReport.delete() }
    testLogging { showStandardStreams = true; exceptionFormat = 'full' }
    outputs.upToDateWhen { false }
    finalizedBy 'standCleanup', 'standReport'
}

def standDocker = providers.exec { commandLine 'sh', '-c', 'docker info >/dev/null 2>&1'; ignoreExitValue = true }
    .result.get().exitValue == 0
def standHost = (project.findProperty('engine') ?: 'compose') == 'host'

// jagt's own image on the published stand base (OS layer plus the agent CLI), pinned by digest.
tasks.register('standImage', Exec) {
    description = 'Builds jagt-stand: jagt as shipped on the published stand base image.'
    group = 'verification'
    dependsOn ':bootJar'
    commandLine 'sh', '-c',
        'docker build --build-context "jar=$1" --build-arg BASE=ghcr.io/guldmitry/jagt-stand-base:base@sha256:dde63c13e93be962909a0ff2f1034729a00136e6c0b49acbb3a84014891ced0e -t jagt-stand "$0"',
        standRepo, rootProject.layout.buildDirectory.dir('libs').get().asFile.absolutePath
    onlyIf { // no Docker means no stand image
        if (!standHost && !standDocker) {
            System.out.println('docker is absent on this machine, so the stand image is not built and the stand run is skipped; -Pengine=host runs it on the host')
        }
        !standHost && standDocker
    }
}

tasks.register('standImageRemove', Exec) {
    description = 'Removes the jagt-stand* image tags.'
    commandLine 'sh', '-c',
        'docker image rm -f jagt-stand jagt-stand:run jagt-stand:next jagt-stand-next >/dev/null 2>&1 || true' // absent is removed
    onlyIf { standDocker }  // nothing to remove without Docker
}

tasks.register('standTimingGate', JavaExec) {
    description = 'Fails when a stand timing passes twice the median of its last ten history entries.'
    group = 'verification'
    classpath = sourceSets.stand.runtimeClasspath
    mainClass = 'dev.jagt.orchestrator.stand.StandTimingGate'
    args(layout.buildDirectory.file('stand/timings-history.json').get().asFile.absolutePath,
            layout.buildDirectory.file('stand/timings.json').get().asFile.absolutePath)
}

tasks.register('standReport', JavaExec) {
    description = 'Prints the pass rate of the last standTest per scenario and mode.'
    group = 'verification'
    classpath = sourceSets.stand.runtimeClasspath
    mainClass = 'dev.jagt.orchestrator.stand.StandReport'
    args(standReport.absolutePath)
}

// Whatever the outcome: stops what dead stand runs left, keeps a failed run's evidence under build/stand/failed, and removes
// their roots, their trust entries in the human's Claude config and their transcript directories.
['standCleanup', 'standClean'].each { name ->
    tasks.register(name, JavaExec) {
        description = 'Removes what finished stand runs left: roots, Claude trust entries and transcripts.'
        group = 'verification'
        classpath = sourceSets.stand.runtimeClasspath
        mainClass = 'dev.jagt.orchestrator.stand.StandCleanup'
        args(standBase, layout.buildDirectory.dir('stand/failed').get().asFile.absolutePath)
        finalizedBy 'standImageRemove'
    }
}
