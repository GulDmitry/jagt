// The tool-bound fitness functions of fitness.yml: the plugin reads each threshold from there and binds it to the tool that enforces it.
pluginManager.apply('fitness')

fitness {
    file = layout.projectDirectory.file('../fitness.yml')
    classpath.from(sourceSets.test.runtimeClasspath)
    minutesProperty = 'runMinutes'
    // 0139: -Ptimed=false (CI) stops a hang by its job's timeout alone; a shared runner's minutes are no measure.
    timed = providers.gradleProperty('timed').map { it != 'false' }.orElse(true)
    contextsSystemProperties = ['logging.level.org.springframework.test.context.cache': 'DEBUG']
    contextsPattern = 'DefaultContextCache@(\\w+) .*?missCount = (\\d+)'
}

// 0188: the scan reads the release SBOM. The plugin registers its checks once every project is evaluated.
gradle.projectsEvaluated {
    tasks.named('fitnessVulnerabilities') {
        dependsOn 'cyclonedxBom'
        sbom = layout.buildDirectory.file('reports/sbom/jagt.cdx.json')
    }
}

dev.jagt.gradle.checkscope.CheckScope.registerOn(project)
