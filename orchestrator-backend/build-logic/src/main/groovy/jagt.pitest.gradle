// No threshold: a survivor is judged by the one who wrote its line.
def usecaseGitClasses = ['GitWorktrees', 'GitDeploy', 'WorktreeInspection', 'GitStates', 'GitCommands', 'WorktreeHooks', 'DiffCheckouts']
    .collect { "dev.jagt.orchestrator.service.${it}" }

subprojects {
    apply plugin: 'info.solidsoft.pitest'
    def pitestTargets = providers.gradleProperty('pitestTargets').map { it.split(',').toList() }
    // Only `:adapter`'s real-git tests run the `:usecase` classes listed above, so `:adapter` mutates them and `:usecase` does not.
    def ownTargets = project.path == ':adapter' ? ['dev.jagt.orchestrator.adapter.*'] + usecaseGitClasses : ['dev.jagt.*']

    pitest {
        pitestVersion = '1.30.1'
        junit5PluginVersion = '1.2.3'
        targetClasses = pitestTargets.orElse(ownTargets)
        targetTests = ['dev.jagt.*']
        excludedMethods = ['toString', 'hashCode']
        if (project.path == ':usecase') {
            excludedClasses = usecaseGitClasses.collectMany { [it, it + '$*'] }
            // Most of `:core` is exercised only through `:usecase`, so its mutants are judged against both modules' tests.
            additionalMutableCodePaths = project(':core').sourceSets.main.output.classesDirs.files
        }
        if (project.path == ':adapter') {
            additionalMutableCodePaths = project(':usecase').sourceSets.main.output.classesDirs.files
        }
        threads = Runtime.runtime.availableProcessors()
        outputFormats = ['HTML', 'XML']
        timestampedReports = false
        jvmArgs = ['-Xshare:off', '-Duser.language=en', '-Duser.country=US', '-Duser.timezone=UTC']
    }

    tasks.named('pitest') { forkedTestEnv(it) }
}

// Every `test` ends in `pitestDiff` (0127): pitest on the main classes changed against `-PpitestDiff=<base>` (default
// HEAD, the tree included), listing the survivors standing on a changed line; nothing else is judged.
def base = providers.gradleProperty('pitestDiff').map { it ?: 'HEAD' }.getOrElse('HEAD')
def diff = providers.exec {
    workingDir rootDir
    commandLine 'git', 'diff', '-U0', base, '--', '*/src/main/java/*.java'
}.standardOutput.asText.get()
def changedLines = [:].withDefault { [] as Set }
def file = null
diff.eachLine { line ->
    def path = line =~ /^\+\+\+ b\/(.+)$/
    def hunk = line =~ /^@@ .* \+(\d+)(?:,(\d+))? @@/
    if (path) {
        file = path[0][1]
    } else if (hunk && file) {
        def from = hunk[0][1] as int
        def count = (hunk[0][2] ?: '1') as int
        (from..<(from + count)).each { changedLines[file] << it }
    }
}
def classOf = { String path -> path.replaceFirst('^.*?src/main/java/', '').replace('.java', '').replace('/', '.') }
def moduleOf = { String path -> ':' + path.replaceFirst('^orchestrator-backend/', '').tokenize('/')[0] }
// The root project's own main classes carry no pitest.
changedLines.keySet().removeAll { !findProject(moduleOf(it)) }
def targets = [:].withDefault { [] }
changedLines.keySet().each { path ->
    def type = classOf(path)
    def owner = moduleOf(path)
    if (owner == ':usecase' && type in usecaseGitClasses) {
        owner = ':adapter'
    }
    targets[owner] << type
    if (owner == ':core') {
        targets[':usecase'] << type
    }
}
targets.each { module, types ->
    project(module).pitest.targetClasses = types.collectMany { [it, it + '$*'] }
}
tasks.register('pitestDiff') {
    dependsOn targets.keySet().collect { "$it:pitest" }
    def reports = targets.keySet().collect { project(it).layout.buildDirectory.file('reports/pitest/mutations.xml').get().asFile }
    def lines = changedLines.collectEntries { path, numbers -> [(path.replaceFirst('^.*?src/main/java/', '')): numbers] }
    doLast {
        if (!lines) {
            println "pitestDiff: no main line changed against ${base}"
            return
        }
        // A `:core` mutant is mutated by `:usecase` too; it stands only if no report killed it.
        def outcomes = [:].withDefault { [] as Set }
        reports.findAll { it.exists() }.each { report ->
            new groovy.xml.XmlSlurper().parse(report).mutation.each {
                def source = it.mutatedClass.text().replaceFirst('\\.[^.]+$', '').replace('.', '/') + '/' + it.sourceFile.text()
                def number = it.lineNumber.text() as int
                if (lines[source]?.contains(number)) {
                    def mutant = "${source}:${number} ${it.mutatedMethod.text()} ${it.description.text()} ${it.indexes.text()}".toString()
                    outcomes[mutant] << it.@status.text()
                }
            }
        }
        def standing = outcomes.findAll { mutant, statuses -> statuses.every { it in ['SURVIVED', 'NO_COVERAGE'] } }.keySet()
        println standing ? "pitestDiff: judge each before the commit\n" + standing.sort().join('\n')
                : 'pitestDiff: no mutant survives on a changed line'
    }
}

def gateTests = allprojects.collect { it == rootProject ? ':test' : "${it.path}:test" }
allprojects {
    tasks.matching { it.name == 'test' }.configureEach { finalizedBy ':pitestDiff' }
    tasks.matching { it.name == 'pitest' }.configureEach { mustRunAfter gateTests }
}
