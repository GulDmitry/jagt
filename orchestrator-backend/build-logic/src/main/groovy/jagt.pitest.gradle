// No threshold: a survivor is judged by the one who wrote its line.
def usecaseGitClasses = ['GitWorktrees', 'GitDeploy', 'WorktreeInspection', 'GitStates', 'GitCommands', 'WorktreeHooks', 'DiffCheckouts', 'WorkspaceBranch']
    .collect { "dev.jagt.orchestrator.service.git.${it}".toString() } + ['dev.jagt.orchestrator.job.checker.workspace.WorkspaceRequests']

allprojects {
    // The register's one row for this plugin: its deprecation is Gradle-reported at apply time and only upstream can end it.
    def pitestWarningAccepted = file("${rootDir}/build-logic/accepted-warnings.txt").readLines().any { it.startsWith('Configuration.setVisible(boolean)') }
    def applyPitest = { apply plugin: 'info.solidsoft.pitest' }
    if (pitestWarningAccepted) {
        org.gradle.internal.deprecation.DeprecationLogger.whileDisabled(applyPitest as Runnable)
    } else {
        applyPitest()
    }
    def pitestTargets = providers.gradleProperty('pitestTargets').map { it.split(',').toList() }
    // Only `:adapter`'s real-git tests run the `:usecase` classes listed above, so `:adapter` mutates them and `:usecase` does not.
    def ownTargets = project.path == ':adapter' ? ['dev.jagt.orchestrator.adapter.*'] + usecaseGitClasses : ['dev.jagt.*']

    pitest {
        pitestVersion = '1.30.2'
        junit5PluginVersion = '1.2.3'
        targetClasses = pitestTargets.orElse(ownTargets)
        targetTests = ['dev.jagt.*']
        excludedMethods = ['toString', 'hashCode']
        failWhenNoMutations = false
        if (project.path == ':usecase') {
            excludedClasses = usecaseGitClasses.collectMany { [it, it + '$*'] } // these classes are mutated from :adapter, where their tests live
            // Most of `:core` is exercised only through `:usecase`, so its mutants are judged against both modules' tests.
            additionalMutableCodePaths = project(':core').sourceSets.main.output.classesDirs.files
        }
        if (project.path == ':adapter') {
            additionalMutableCodePaths = project(':usecase').sourceSets.main.output.classesDirs.files
        }
        threads = (project.findProperty('pitestThreads') ?: Runtime.runtime.availableProcessors().intdiv(2)) as int
        outputFormats = ['HTML', 'XML']
        timestampedReports = false
        // A property run per mutant at jqwik's 1,000 tries is what made `:core` take 47 min (0139).
        // A minion carries the test JVM properties too (jagt.parallel-tests): without them it resets Logback under every log capture.
        // Mockito as an agent: its self-attach starts a second JVM in each of the minions, one per mutated class.
        jvmArgs = project.provider {
            def mockito = configurations.findByName('testRuntimeClasspath')?.files?.find { it.name.startsWith('mockito-core-') }
            (mockito ? ["-javaagent:${mockito.absolutePath}"] : []) +
                    ['-Xshare:off', '-Djqwik.tries.default=100'] + project.testJvmProperties.collect { key, value -> "-D${key}=${value}".toString() }
        }
    }

    tasks.named('pitest') { forkedTestEnv(it) }

    // `:usecase` runs `:core`'s tests too, so a changed `:core` type is mutated there alone (0139).
    if (project.path == ':core') {
        configurations.create('pitestTests') {
            canBeConsumed = true
            canBeResolved = false
            extendsFrom configurations.testImplementation, configurations.testRuntimeOnly
            outgoing.artifacts(provider { sourceSets.test.output.classesDirs.files }) { builtBy tasks.named('testClasses') }
        }
    }
    if (project.path == ':usecase') {
        def coreTests = configurations.create('pitestCoreTests') {
            canBeConsumed = false
            canBeResolved = true
        }
        dependencies { pitestCoreTests project(path: ':core', configuration: 'pitestTests') }
        tasks.named('pitest') { additionalClasspath.from(coreTests) }
    }
}

// Every `test` ends in `pitestDiff` (0127): pitest on the main classes changed against `-PpitestDiff=<base>` (default
// HEAD, the tree included), listing the survivors standing on a changed line; nothing else is judged.
def base = providers.gradleProperty('pitestDiff').map { it ?: 'HEAD' }.getOrElse('HEAD')
def repoRoot = rootDir.parentFile
def git = { List<String> args -> providers.exec { workingDir repoRoot; commandLine(['git'] + args) }.standardOutput.asText.get() }
// A branch behind its base is diffed from where it forked, so the base's newer lines are not its own.
def forkPoint = base == 'HEAD' ? 'HEAD' : git(['merge-base', base, 'HEAD']).trim()
def diff = providers.exec {
    workingDir rootDir
    commandLine 'git', 'diff', '-U0', forkPoint, '--', '*/src/main/java/*.java', 'src/main/java/*.java'
}.standardOutput.asText.get()
def changedLines = [:].withDefault { [] as Set }
def file = null
diff.eachLine { line ->
    def path = line =~ /^\+\+\+ b\/(.+)$/
    def hunk = line =~ /^@@ .* \+(\d+)(?:,(\d+))? @@/
    if (path) {
        file = path[0][1]
    } else if (hunk && file) {
        def from = hunk[0][1] as int
        def count = (hunk[0][2] ?: '1') as int
        (from..<(from + count)).each { changedLines[file] << it }
    }
}
// A line only a `.git-blame-ignore-revs` commit touched in the range (a mass reformat) is not a change to judge.
def ignoreRevs = new File(repoRoot, '.git-blame-ignore-revs')
def ignored = ignoreRevs.exists() ? ignoreRevs.readLines().findAll { it ==~ /[0-9a-f]{40}/ } as Set : [] as Set
def inRange = base == 'HEAD' ? [] as Set : git(['rev-list', "${base}..HEAD"]).readLines() as Set
if (ignored.intersect(inRange)) {
    def kept = (inRange - ignored) + ['0' * 40]
    changedLines.keySet().each { path ->
        def blamed = git(['blame', '--porcelain', '--ignore-revs-file', ignoreRevs.path, '--', path]).readLines()
            .collect { it =~ /^([0-9a-f]{40}) \d+ (\d+)/ }.findAll { it }.collectEntries { [(it[0][2] as int): it[0][1]] }
        changedLines[path].retainAll { blamed[it] in kept }
    }
    changedLines.keySet().removeAll { changedLines[it].isEmpty() }
}
def classOf = { String path -> path.replaceFirst('^.*?src/main/java/', '').replace('.java', '').replace('/', '.') }
// The included build `build-logic/` is no root project and is not mutated here: its lines leave the diff.
changedLines.keySet().removeAll { !dev.jagt.gradle.pitest.DiffOwner.projectOf(it).present }
def moduleOf = { String path ->
    def owner = dev.jagt.gradle.pitest.DiffOwner.projectOf(path).get()
    if (!findProject(owner)) {
        throw new GradleException("pitestDiff: no project ${owner} owns ${path}")
    }
    owner
}
def targets = [:].withDefault { [] }
// The included build `fitness/` mutates its own modules (0162); it reads the changed-lines file below for its classes.
def fitnessModules = [] as Set
changedLines.keySet().each { path ->
    def fitnessModule = path =~ /^orchestrator-backend\/fitness\/([^\/]+)\/src\/main\/java\//
    if (fitnessModule) {
        fitnessModules << fitnessModule[0][1]
        return
    }
    def type = classOf(path)
    def owner = moduleOf(path)
    if (owner == ':usecase' && type in usecaseGitClasses) {
        owner = ':adapter'
    }
    if (owner == ':core') {
        owner = ':usecase'
    }
    targets[owner] << type
}
// Pitest mutates every line of a target class; the filter drops what is off the diff before a mutant runs (0196).
def changedLinesFile = rootProject.layout.buildDirectory.file('pitest-diff/changed-lines.txt').get().asFile
if (targets || fitnessModules) {
    changedLinesFile.parentFile.mkdirs()
    changedLinesFile.text = changedLines.collect { path, numbers ->
        "${path.replaceFirst('^.*?src/main/java/', '')}:${numbers.sort().join(',')}"
    }.sort().join('\n') + '\n'
}
def filterJar = files(project(':mutation-scope').tasks.named('jar'))
targets.each { module, types ->
    project(module).pitest.targetClasses = types.collectMany { [it, it + '$*'] }
    project(module).pitest.features = ["+CHANGEDLINES(lines[${changedLinesFile.absolutePath}])".toString()]
    project(module).dependencies.add('pitest', filterJar) // a file, not a project dependency: the lock state of `pitest` stays as it is
}
tasks.register('pitestDiff') {
    dependsOn targets.keySet().collect { project(it).tasks.named('pitest') }
    dependsOn fitnessModules.collect { gradle.includedBuild('fitness').task(":${it}:pitest") }
    def reports = targets.keySet().collect { project(it).layout.buildDirectory.file('reports/pitest/mutations.xml').get().asFile } +
            fitnessModules.collect { rootDir.toPath().resolve("fitness/${it}/build/reports/pitest/mutations.xml").toFile() }
    def lines = changedLines.collectEntries { path, numbers -> [(path.replaceFirst('^.*?src/main/java/', '')): numbers] }
    doLast {
        if (!lines) {
            println "pitestDiff: no main line changed against ${base}"
            return
        }
        def outcomes = [:].withDefault { [] as Set }
        def mutated = [] as Set
        reports.findAll { it.exists() }.each { report ->
            new groovy.xml.XmlSlurper().parse(report).mutation.each {
                def source = it.mutatedClass.text().replaceFirst('\\.[^.]+$', '').replace('.', '/') + '/' + it.sourceFile.text()
                def number = it.lineNumber.text() as int
                if (lines[source]?.contains(number)) {
                    mutated << source
                    def mutant = "${source}:${number} ${it.mutatedMethod.text()} ${it.description.text()} ${it.indexes.text()}".toString()
                    outcomes[mutant] << it.@status.text()
                }
            }
        }
        def standing = outcomes.findAll { mutant, statuses -> statuses.every { it in ['SURVIVED', 'NO_COVERAGE'] } }.keySet()
        println standing ? "pitestDiff: judge each before the commit\n" + standing.sort().join('\n')
                : 'pitestDiff: no mutant survives on a changed line'
        // A changed file with no mutant on its changed lines is unjudged, which "no mutant survives" must not read as killed.
        (lines.keySet() - mutated).sort().each { println "pitestDiff: no mutant generated on ${it}" }
    }
}

def gateTests = allprojects.collect { it == rootProject ? ':test' : "${it.path}:test" }
// A `--tests` run executes part of the suite, so mutating after it proves nothing.
def filteredRun = gradle.startParameter.taskNames.contains('--tests')
allprojects {
    if (!filteredRun) {
        tasks.matching { it.name == 'test' }.configureEach { finalizedBy ':pitestDiff' }
    }
    tasks.matching { it.name == 'pitest' }.configureEach { mustRunAfter gateTests }
}
