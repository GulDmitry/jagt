sourceSets {
    boardTest {
        java.srcDirs = ['src/boardTest/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

dependencies {
    // Playwright brings its OWN Chromium, downloaded on first run: the suite asks the host for no browser, so
    // a Mac and a runner execute the same thing. The shared libraries it links against come from
    // scripts/linux-test-deps.sh.
    boardTestImplementation 'com.microsoft.playwright:playwright:1.64.0'
}

tasks.register('playwrightChromium', JavaExec) {
    description = 'Installs the Chromium the board suite drives (a no-op once it is in the local cache).'
    group = 'verification'
    classpath = sourceSets.boardTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('boardTest', Test) {
    description = 'Drives the web board in a headless Chromium.'
    group = 'verification'
    testClassesDirs = sourceSets.boardTest.output.classesDirs
    classpath = sourceSets.boardTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('playwrightChromium')
    // Left to itself the client installs every browser it supports — a quarter of a gigabyte for a suite that
    // drives one.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    shouldRunAfter tasks.named('test')
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // Gated on CAPABILITY, never on which harness is running it, and it names what is missing.
    onlyIf { task ->
        List<String> missing = []
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            missing << 'Linux'
        }
        ['notify-send', 'kitty', 'dbus-monitor', 'pgrep'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!System.getenv('DISPLAY')) {
            missing << 'DISPLAY (start it with scripts/with-linux-desktop.sh)'
        }
        if (missing) {
            task.logger.lifecycle("Skipping linuxDriverTest — missing: ${missing.join(', ')}."
                    + " On a Mac: scripts/linux-suite.sh runs it in a container.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end task-flow matrix (needs git + tmux; creates and removes throwaway worktrees).'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    useJUnitPlatform()
    // Its classes are order-dependent within, not between: each fork names its tmux sessions by its own pid.
    maxParallelForks = Runtime.runtime.availableProcessors()
    // A run killed mid-suite skips its @TempDir cleanup: its leftovers land here, and the next run wipes them.
    def scratch = temporaryDir
    systemProperty 'java.io.tmpdir', scratch.absolutePath
    doFirst {
        scratch.deleteDir()
        scratch.mkdirs()
    }
    shouldRunAfter tasks.named('test')
}
