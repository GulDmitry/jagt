// Needs git + tmux on the machine, so it stays out of `test`/`check`, which must remain hermetic.
sourceSets {
    e2e {
        java.srcDirs = ['src/e2e/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Spends model tokens on a local stand, so it is asked for by name. NOT in `check`.
sourceSets {
    stand {
        java.srcDirs = ['src/stand/java']
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

// Shared by the model evals and their unit test, kept out of src/test so no eval's Spring scan meets a test class.
sourceSets {
    evalSupport {
        java.srcDirs = ['src/evalSupport/java']
        compileClasspath += configurations.testCompileClasspath
        runtimeClasspath += configurations.testRuntimeClasspath
    }
    test {
        compileClasspath += sourceSets.evalSupport.output
        runtimeClasspath += sourceSets.evalSupport.output
    }
}

