// Runs the real installers against a fake release feed, so it needs the network and the machine's own shell.
// NOT in `check`.
sourceSets {
    installTest {
        java.srcDirs = ['src/installTest/java']
        compileClasspath += configurations.testCompileClasspath
        runtimeClasspath += configurations.testRuntimeClasspath
    }
