dependencies {
    // Playwright brings its OWN Chromium, downloaded on first run: the suite asks the host for no browser, so
    // a Mac and a runner execute the same thing. The shared libraries it links against come from
    // scripts/linux-test-deps.sh.
    boardTestImplementation 'com.microsoft.playwright:playwright:1.64.0'
    // The accessibility checker runs in the page from the test's classpath: the board ships none of it.
    boardTestImplementation 'com.deque.html.axe-core:playwright:4.14.0'
    boardTestCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    boardTestAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    e2eCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    e2eAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.register('playwrightChromium', JavaExec) {
    description = 'Installs the Chromium the board suite drives (a no-op once it is in the local cache).'
    group = 'verification'
    classpath = sourceSets.boardTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('boardTest', Test) {
    description = 'Drives the web board in a headless Chromium.'
    group = 'verification'
    testClassesDirs = sourceSets.boardTest.output.classesDirs
    classpath = sourceSets.boardTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('playwrightChromium')
    // Left to itself the client installs every browser it supports — a quarter of a gigabyte for a suite that
    // drives one.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1' // playwrightChromium installs the one browser
    def coverageDump = layout.settingsDirectory.dir('../board/coverage/browser').asFile
    systemProperty 'board.coverage.dir', coverageDump.absolutePath
    doFirst { coverageDump.deleteDir() }
    finalizedBy 'boardCoverage'
    shouldRunAfter tasks.named('test')
}

tasks.register('boardCoverage', Exec) {
    description = 'Merges the browser coverage boardTest wrote with the board unit tests; fails a file under its floor.'
    group = 'verification'
    def board = layout.settingsDirectory.dir('../board').asFile
    workingDir = board
    commandLine 'npm', 'run', '--silent', 'coverage:browser'
    def filteredRun = gradle.startParameter.taskNames.contains('--tests')
    onlyIf { task ->
        List<String> missing = []
        if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                .any { dir -> dir && new File(dir, 'npm').canExecute() }) {
            missing << 'npm'
        }
        if (!new File(board, 'node_modules').directory) {
            missing << 'board/node_modules (run npm ci in board/)'
        }
        if (missing && System.getenv('CI')) {
            throw new GradleException("boardCoverage cannot run on CI — missing: ${missing.join(', ')}.")
        }
        if (missing) {
            task.logger.lifecycle("Skipping boardCoverage — missing: ${missing.join(', ')}.")
        }
        !filteredRun && missing.isEmpty() && new File(board, 'coverage/browser').directory // a `--tests` run proves no ratio
    }
}

tasks.register('linuxDriverTest', Test) {
    description = 'Exercises the Linux platform drivers against real notify-send/kitty (container only).'
    group = 'verification'
    testClassesDirs = sourceSets.linuxTest.output.classesDirs
    classpath = sourceSets.linuxTest.runtimeClasspath
    useJUnitPlatform()
    // Gated on CAPABILITY, never on which harness is running it, and it names what is missing.
    onlyIf { task -> // skip, naming what is missing, off a non-Linux host
        List<String> missing = []
        if (!System.getProperty('os.name').toLowerCase().contains('linux')) {
            missing << 'Linux'
        }
        ['notify-send', 'kitty', 'dbus-monitor', 'pgrep'].each { binary ->
            if (!(System.getenv('PATH') ?: '').split(File.pathSeparator)
                    .any { dir -> dir && new File(dir, binary).canExecute() }) {
                missing << binary
            }
        }
        if (!System.getenv('DISPLAY')) {
            missing << 'DISPLAY (start it with scripts/with-linux-desktop.sh)'
        }
        if (missing) {
            task.logger.lifecycle("Skipping linuxDriverTest — missing: ${missing.join(', ')}."
                    + " On a Mac: scripts/ci-local.sh heavy runs it in a container.")
        }
        missing.isEmpty()
    }
    shouldRunAfter tasks.named('test')
}

