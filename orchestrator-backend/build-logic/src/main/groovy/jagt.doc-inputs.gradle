import org.gradle.api.tasks.PathSensitivity

// FitnessTest, ConfigReferenceTest, CiWorkflowTest and TestTmuxCleanupTest read files that live outside every source set: without declaring it
// the task stays UP-TO-DATE while a document grows past its budget, and the suite is green over a breach.
tasks.named('test') {
    inputs.files(fileTree(projectDir.parentFile) {
        include '*.md'
        include 'fitness.yml'
        include 'docs/**/*.md'
        include 'openspec/specs/**/*.md'
        include 'orchestrator-backend/*/src/main/resources/prompts/*.md'
        include '.claude/rules/*.md'
        include 'orchestrator-backend/*/src/*/java/**/*.java'
        include 'orchestrator-backend/src/*/java/**/*.java'
        include 'jagt.desktop.yml.dist'
        include 'jagt.server.yml.dist'
        include 'examples/kubernetes.yml'
        include 'Dockerfile'
        include 'entrypoint.sh'
        include 'contracts/openapi.yaml'
        include 'roles/**/*.dist'
    }).withPropertyName('documents').withPathSensitivity(PathSensitivity.RELATIVE)
    // CiWorkflowTest reads the workflow, TestTmuxCleanupTest the script, AcceptedWarningsTest the register and the versions it names.
    inputs.files(fileTree(projectDir.parentFile) {
        include '.github/workflows/*.yml'
        include 'orchestrator-backend/gradle/*.sh'
        include 'orchestrator-backend/build-logic/accepted-warnings.txt'
        include 'orchestrator-backend/build-logic/build.gradle'
        include 'orchestrator-backend/gradle/wrapper/gradle-wrapper.properties'
    }).withPropertyName('buildFiles').withPathSensitivity(PathSensitivity.RELATIVE)
    // Outside the tree above: a file tree drops `.gitignore` by default.
    inputs.file(new File(projectDir.parentFile, '.gitignore')).withPropertyName('gitignore')
}

// SourceRoots imports the classes of every source set of every project, so each is compiled before `test` or `pitest` reads it.
tasks.matching { it.name in ['test', 'pitest'] }.configureEach {
    dependsOn {
        allprojects.collectMany { project -> project.sourceSets.collect { project.tasks.named(it.classesTaskName) } }
    }
}
