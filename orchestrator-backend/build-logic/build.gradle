buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'groovy-gradle-plugin'
}

dependencyLocking {
    lockAllConfigurations()
}

repositories {
    gradlePluginPortal()
}

dependencies {
    implementation 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.11.0'
    implementation 'org.cyclonedx:cyclonedx-gradle-plugin:3.6.1'
}
