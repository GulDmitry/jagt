buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'groovy-gradle-plugin'
    id 'checkstyle'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

checkstyle {
    toolVersion = '14.4.0'
    configDirectory = layout.settingsDirectory.dir('../gradle/checkstyle')
    maxWarnings = 0
}

tasks.named('checkstyleMain') {
    source = fileTree('src/main/java')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-parameters', '-Xlint:all,-processing', '-Werror'])
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.withType(Checkstyle)
}

dependencyLocking {
    lockAllConfigurations()
}

repositories {
    gradlePluginPortal()
}

dependencies {
    implementation 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.11.0'
    implementation 'org.cyclonedx:cyclonedx-gradle-plugin:3.6.1'
    compileOnly 'org.jspecify:jspecify:1.0.1'
    testCompileOnly 'org.jspecify:jspecify:1.0.1'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
