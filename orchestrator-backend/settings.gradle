pluginManagement {
    includeBuild 'build-logic'
    includeBuild 'fitness'
}

// The fitness library and its engines: its own build, no jagt names inside (0210).
includeBuild 'fitness'

rootProject.name = 'orchestrator-backend'

// One module per ring, so the dependency rule is the compiler's: `:core` sees nothing of jagt's, `:usecase` sees
// only the centre, `:adapter` and `:surface` see the centre and the use cases, and only the root sees every
// adapter — which is what makes it the assembly.
include 'statechart'
include 'core'
include 'usecase'
include 'adapter'
include 'surface'

// A pitest plugin the commit gate's `pitestDiff` loads; nothing consumes it and the jar never ships it (0196).
include 'mutation-scope'

// The stand harness is a module nothing consumes: the assembly never holds it, so it may name vendors the rings may not.
include 'stand'
