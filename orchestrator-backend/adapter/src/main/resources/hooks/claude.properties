# Which of Claude Code's own events mean what to jagt. One line per event the CLI fires; the value is the
# state jagt records for the session. Remove a line to stop reporting that event; add one for an event this
# CLI gains. Nothing else has to change.
#
#   waiting  nothing moves in that session until a human answers
#   gone     the session is over
#   idle     a turn ended; only nothing happening after it means anything
#   working  it is moving again, so any waiting stamp is dropped
#
# Claude's stop fires at the end of EVERY turn, including the ones a background task brings the session straight
# back from, so it reports the quiet state and lets the threshold decide.
#
# Its notification covers a permission prompt AND a prompt merely left idle for a minute. The wording below is
# the only thing that tells them apart; a notification that does not carry it stays `idle`, so a wording this
# CLI changes costs promptness rather than inventing a stopped session.

# A gate, not a report: this event is ANSWERED, and a refusal is what the model reads instead of running the
# call. jagt refuses one thing there — a push to anything but the task's branch.
gate=PreToolUse
# The PHRASE in a notification that means the session is blocked rather than idle. A single word would also
# match a notification that merely mentions it.
blocking-notification=needs your permission
# What this CLI calls a start that follows a compaction, which is the one start jagt answers with a brief.
compacted-start=compact

Notification=idle
Stop=idle
SessionEnd=gone
SessionStart=working
UserPromptSubmit=working
