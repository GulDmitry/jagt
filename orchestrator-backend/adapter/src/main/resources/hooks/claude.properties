# Which of Claude Code's own events mean what to jagt. One line per event the CLI fires; the value is the
# state jagt records for the session. Remove a line to stop reporting that event; add one for an event this
# CLI gains. Nothing else has to change.
#
#   gone     the session is over
#   idle     a turn ended; only nothing happening after it means anything
#   working  it is moving again, so a permission its blocking notification raised is dropped
#
# Its notification covers a permission prompt AND a prompt merely left idle for a minute. The wording below is
# the only thing that tells them apart; a notification that does not carry it stays `idle`, so a wording this
# CLI changes costs promptness rather than inventing a permission.

# A gate, not a report: this event is ANSWERED, and a refusal is what the model reads instead of running the
# call. What jagt refuses there is ToolGate's: a push off the task's branch, deleting, branchless, hook-skipping,
# with -c, $'...' or forced unleased; a plumbing push; gh/glab but a read; git worktree add; a line reaching the
# board or token.
# Its gaps: decisions 0028 to 0030.
gate=PreToolUse
# The PHRASE in a notification that means the session is blocked rather than idle. A single word would also
# match a notification that merely mentions it.
blocking-notification=needs your permission
# What this CLI calls a start that follows a compaction, which is the one start jagt answers with a brief.
compacted-start=compact
# The end of EVERY turn, reported as idle and ANSWERED: a turn that leaves the agent's move unreported is sent on.
turn-end=Stop
# A prompt the human submits, ANSWERED: blocked only when the session sat idle past its cache lifetime and the
# prompt went to a fresh session instead. Otherwise the session is reported as working.
prompt-gate=UserPromptSubmit
# A turn this CLI ended on an API error; the hook carries the error's own word.
turn-failure=StopFailure
# The error word meaning a usage limit, the one failure a wake answers.
rate-limit-error=rate_limit
# SessionEnd reasons a new start follows at once, so not an end.
continuing-end=clear,resume
# Phrases, split on |, only the trust dialog shows; it opens before any hook, so its window alone says it waits.
trust-dialog=Yes, I trust this folder|Do you trust the files in this folder|a project you created or one you trust

Notification=idle
SessionEnd=gone
SessionStart=working
