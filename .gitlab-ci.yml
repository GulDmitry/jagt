# The same three groups as .github/workflows/ci.yml; both call the SAME scripts, so a step can only exist in one of
# them by mistake. The jobs run IN a Java image and apt-install what they need. Only `heavy` needs a Docker daemon: a
# docker:dind service, so that job wants a privileged runner.
# `stand` runs the compose engine alone: kind needs a cluster node in a container, which wants a privileged runner of its
# own, so only GitHub's nightly runs it. The image publish and the pages stay GitHub-only.
stages:
  - test
  - heavy
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"

default:
  image: eclipse-temurin:25-jdk@sha256:b8705e936964c228dfce359e63dbf08f6c69cb380ed1d576b1f6b1064f15567d
  before_script:
    - cd orchestrator-backend
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-home"
    - export PLAYWRIGHT_BROWSERS_PATH="$CI_PROJECT_DIR/.gradle-home/ms-playwright"
  cache:
    key:
      files:
        - orchestrator-backend/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
      - .gradle-home/ms-playwright

test:
  stage: test
  timeout: 25m
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - (cd .. && orchestrator-backend/scripts/secret-scan.sh)
    - curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - echo "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8  /tmp/node.tar.xz" | sha256sum -c -
    - tar -xJf /tmp/node.tar.xz -C /opt && export PATH="/opt/node-v22.23.5-linux-x64/bin:$PATH"
    - (cd ../board && npm ci && npm audit --audit-level=high && npm run lint && npm test)
    - ./gradlew --no-daemon test
    - scripts/vulnerability-scan.sh
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/build/reports/tests/test

heavy:
  stage: heavy
  timeout: 25m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG =~ /^v/
  services:
    - docker:29-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh scripts/linux-test-deps.sh
    - apt-get install -y --no-install-recommends docker.io docker-compose-v2 curl
    - scripts/vulnerability-scan.sh
    - curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - echo "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8  /tmp/node.tar.xz" | sha256sum -c -
    - tar -xJf /tmp/node.tar.xz -C /opt && export PATH="/opt/node-v22.23.5-linux-x64/bin:$PATH"
    - (cd ../board && npm ci)
    - git config --global user.email "ci@example.com"
    - git config --global user.name "jagt ci"
    - scripts/with-linux-desktop.sh ./gradlew --no-daemon e2eTest linuxDriverTest boardTest
    - scripts/container-suite.sh
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/build/reports/tests/e2eTest
      - orchestrator-backend/build/reports/tests/linuxDriverTest
      - orchestrator-backend/build/reports/tests/boardTest

stand:
  stage: heavy
  timeout: 25m
  services:
    - docker:29-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh scripts/linux-test-deps.sh
    - apt-get install -y --no-install-recommends docker.io docker-compose-v2 curl
    - git config --global user.email "ci@example.com"
    - git config --global user.name "jagt ci"
    - ./gradlew --no-daemon standTest -Pmodelfree -Pengine=compose
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/stand/build/stand/failed

release:
  stage: release
  timeout: 10m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [test, heavy, stand]
  script:
    - ./gradlew --no-daemon bootJar cyclonedxBom
    - cp build/libs/jagt.jar "build/libs/jagt-$(./gradlew --no-daemon -q printVersion).jar"
  artifacts:
    expire_in: 30 days
    paths:
      - orchestrator-backend/build/libs/jagt-*.jar
      - orchestrator-backend/build/reports/sbom/jagt.cdx.json
