# The same suites as .github/workflows/ci.yml, because jagt is host-agnostic by design and its pipeline has no
# business being an exception. Both files call the SAME scripts (scripts/linux-test-deps.sh,
# scripts/with-linux-desktop.sh), so a step can only exist in one of them by mistake.
#
# No Docker-in-Docker and no privileged runner: the jobs run IN a Java image and apt-install what they need,
# which is also what the container harness does for macOS developers.
stages:
  - test

default:
  image: eclipse-temurin:25-jdk
  before_script:
    - cd orchestrator-backend
    # Gradle's home inside the project so the cache below can carry it between jobs. The board suite's browser
    # too — a cache path outside the project directory is not carried anywhere.
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-home"
    - export PLAYWRIGHT_BROWSERS_PATH="$CI_PROJECT_DIR/.gradle-home/ms-playwright"
  cache:
    # Keyed by the wrapper: a Gradle upgrade gets a fresh cache instead of a corrupted one.
    key:
      files:
        - orchestrator-backend/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
      - .gradle-home/ms-playwright

# Runs everywhere, needs nothing: this is the gate that must stay fast.
unit:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/build/reports/tests/test

# Real git worktrees, real tmux windows, and the Linux drivers against the real binaries.
linux:
  stage: test
  script:
    - sh scripts/linux-test-deps.sh
    - git config --global user.email "ci@example.com"
    - git config --global user.name "jagt ci"
    - scripts/with-linux-desktop.sh ./gradlew --no-daemon e2eTest linuxDriverTest
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/build/reports/tests/e2eTest
      - orchestrator-backend/build/reports/tests/linuxDriverTest

# The board in a real browser: the page's own logic (columns, buttons, the pushed repaint, the palette) is
# asserted nowhere else, and only a browser runs it.
board:
  stage: test
  script:
    - sh scripts/linux-test-deps.sh
    - ./gradlew --no-daemon boardTest
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - orchestrator-backend/build/reports/tests/boardTest

# The jar as a downloadable artifact. Attaching one to a RELEASE is GitHub-only by decision (2026-08-18): the
# owner wants the per-run artifact everywhere and no published release yet, so there is nothing to mirror here.
jar:
  stage: test
  script:
    - ./gradlew --no-daemon bootJar
  artifacts:
    expire_in: 30 days
    paths:
      - orchestrator-backend/build/libs/jagt.jar
