<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-t="login.title">jagt</title>
<link rel="stylesheet" href="app.css" />
<form class="login" method="post" action="login">
  <input type="hidden" name="username" value="owner" />
  <input
    type="password"
    name="password"
    required
    autocomplete="current-password"
    data-t-placeholder="login.password"
  />
  <span id="failed" class="chip bad" data-t="login.failed" hidden></span>
  <button class="primary" data-t="login.submit"></button>
</form>
<script type="module" src="login.js"></script>
