# What a pull request's CI and the local gate leave out: repeated, cold, long, live. Every job but install runs its line through
# scripts/linux-suite.sh <job>, the local twin; its dependencies restore read-only from CI's, as ~20 cold resolutions at once draw
# Maven Central's 429.
# A red opens one issue (the report job); nothing here reruns. docs/rules/ci.md, tier T4.
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'The one job to run, every leg of its matrix (empty: every job)'
        required: false
        default: ''

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_timed: 'false'

defaults:
  run:
    working-directory: orchestrator-backend

jobs:
  stand:
    name: stand ${{ matrix.engine }} x3
    if: (!inputs.job || inputs.job == 'stand')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [compose, kind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: run the stand without a model three times on the engine
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-stand-${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-stand-${{ matrix.engine }}-evidence
          retention-days: 14
          path: |
            orchestrator-backend/stand/build/stand/failed
            orchestrator-backend/stand/build/test-results/standTest

  e2e:
    name: e2e round ${{ matrix.round }}
    if: (!inputs.job || inputs.job == 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: run the end-to-end flows from scratch
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-e2e-${{ matrix.round }}-reports
          retention-days: 14
          path: |
            orchestrator-backend/build/reports/tests/e2eTest
            orchestrator-backend/build/test-results/e2eTest

  properties:
    name: properties at 1000 tries
    if: (!inputs.job || inputs.job == 'properties')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: run the properties at 1000 tries
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-properties-report
          retention-days: 14
          path: orchestrator-backend/build/reports/tests/test

  pitest:
    name: pitest ${{ matrix.project }}
    if: (!inputs.job || inputs.job == 'pitest')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      # Every job resolves cold: more shards at once and Maven Central answers 429.
      max-parallel: 3
      matrix:
        include:
          - {project: root, minutes: 150}
          - {project: adapter, minutes: 150}
          - {project: core, minutes: 120}
          - {project: usecase, minutes: 150}
          - {project: surface, minutes: 90}
          - {project: stand, minutes: 150}
          - {project: statechart, minutes: 60}
          - {project: mutation-scope, minutes: 60}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: mutate the project
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-pitest-${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-pitest-${{ matrix.project }}-reports
          retention-days: 14
          path: orchestrator-backend/**/build/reports/pitest

  stryker:
    name: stryker
    if: (!inputs.job || inputs.job == 'stryker')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: mutate the board's covered JavaScript
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-stryker

  scan:
    name: live vulnerability scan
    if: (!inputs.job || inputs.job == 'scan')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-nightly
          restore-keys: gradle-home-
      - name: scan the dependencies against live data
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh nightly-scan

  install:
    name: real-feed install (${{ matrix.os }})
    if: (!inputs.job || inputs.job == 'install')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install the latest published release from the real feed
        if: runner.os != 'Windows'
        run: |
          JAGT_HOME="$RUNNER_TEMP/jagt" JAGT_BIN="$RUNNER_TEMP/bin" sh install.sh
          test -x "$RUNNER_TEMP/bin/jagt"
      - name: install the latest published release from the real feed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAGT_HOME = "$env:RUNNER_TEMP\jagt"
          $env:JAGT_BIN = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          if (-not (Test-Path "$env:JAGT_BIN\jagt.cmd")) { throw 'no launcher' }

  report:
    name: open an issue for a red night
    if: failure()
    needs: [stand, e2e, properties, pitest, stryker, scan, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: open the night's issue, or add this run to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --repo "$GITHUB_REPOSITORY" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label nightly --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Red again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --title "nightly red" --body "Red: $RUN"
          fi
