# What a pull request's CI and the local gate leave out: repeated, cold, long, live. Every Gradle job starts with no Gradle
# cache. A red opens one issue (the report job); nothing here reruns. docs/rules/ci.md, tier T4.
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_timed: 'false'

defaults:
  run:
    working-directory: orchestrator-backend

jobs:
  stand:
    name: stand ${{ matrix.engine }} x3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [compose, kind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - name: install what the stand shells out to
        run: sudo scripts/linux-test-deps.sh
      - name: give the runner an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "jagt ci"
      - name: run the stand without a model three times on the engine
        run: ./gradlew --no-daemon gateStand -Pmodelfree -Pengine=${{ matrix.engine }} -PstandRuns=3 --rerun-tasks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-stand-${{ matrix.engine }}-evidence
          retention-days: 14
          path: |
            orchestrator-backend/stand/build/stand/failed
            orchestrator-backend/stand/build/test-results/standTest

  e2e:
    name: e2e round ${{ matrix.round }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - name: install what the suites shell out to
        run: sudo scripts/linux-test-deps.sh
      - name: give git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "jagt ci"
      - name: run the end-to-end flows from scratch
        run: ./gradlew --no-daemon gateRepeat --rerun-tasks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-e2e-${{ matrix.round }}-reports
          retention-days: 14
          path: |
            orchestrator-backend/build/reports/tests/e2eTest
            orchestrator-backend/build/test-results/e2eTest

  properties:
    name: properties at 1000 tries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board/package-lock.json
      - run: ./gradlew --no-daemon gateProperties -PjqwikTries=1000 --rerun-tasks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-properties-report
          retention-days: 14
          path: orchestrator-backend/build/reports/tests/test

  pitest:
    name: pitest ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: root, path: ':', minutes: 150}
          - {project: adapter, path: ':adapter', minutes: 150}
          - {project: core, path: ':core', minutes: 120}
          - {project: usecase, path: ':usecase', minutes: 150}
          - {project: surface, path: ':surface', minutes: 90}
          - {project: stand, path: ':stand', minutes: 60}
          - {project: statechart, path: ':statechart', minutes: 60}
          - {project: mutation-scope, path: ':mutation-scope', minutes: 60}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - run: sudo scripts/linux-test-deps.sh
      - run: ./gradlew --no-daemon gateMutation -PmutationProject=${{ matrix.path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-pitest-${{ matrix.project }}-reports
          retention-days: 14
          path: orchestrator-backend/**/build/reports/pitest

  stryker:
    name: stryker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Mutate the board's covered JavaScript
        working-directory: board
        run: |
          npm ci
          npm run mutate

  scan:
    name: live vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - run: ./gradlew --no-daemon gateScan

  install:
    name: real-feed install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install the latest published release from the real feed
        if: runner.os != 'Windows'
        run: |
          JAGT_HOME="$RUNNER_TEMP/jagt" JAGT_BIN="$RUNNER_TEMP/bin" sh install.sh
          test -x "$RUNNER_TEMP/bin/jagt"
      - name: install the latest published release from the real feed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAGT_HOME = "$env:RUNNER_TEMP\jagt"
          $env:JAGT_BIN = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          if (-not (Test-Path "$env:JAGT_BIN\jagt.cmd")) { throw 'no launcher' }

  report:
    name: open an issue for a red night
    if: failure()
    needs: [stand, e2e, properties, pitest, stryker, scan, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: open the night's issue, or add this run to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --repo "$GITHUB_REPOSITORY" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label nightly --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Red again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --title "nightly red" --body "Red: $RUN"
          fi
