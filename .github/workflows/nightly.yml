name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  deployments: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      nightly: true
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board/package-lock.json
      - name: Mutate the board's covered JavaScript
        working-directory: board
        run: |
          npm ci
          npm run mutate
  delay:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Log the start delay against the cron
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          read -r minute hour _ <<< "$CRON"
          scheduled=$(date -u -d "$(date -u -d "$created" +%F) $hour:$minute" +%s)
          delay=$(( $(date -u -d "$created" +%s) - scheduled ))
          echo "::notice title=nightly start delay::event=nightly.delay cron='$CRON' created_at=$created delay_seconds=$delay"
