# Three groups, as docs/rules/testing-suites.md: `test` on a push or pull request, `heavy` nightly and on a tag,
# `release` on a tag after both. Nothing here is a CI-only code path: a green pipeline and a green laptop mean the same.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: orchestrator-backend

jobs:
  test:
    name: unit + functional
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
      - run: ./gradlew --no-daemon test
      - run: ./gradlew --no-daemon cyclonedxBom
      # google/osv-scanner-action v2.7.1
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932
        with:
          scan-args: -L orchestrator-backend/build/reports/sbom/jagt.cdx.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-report
          path: orchestrator-backend/build/reports/tests/test

  heavy:
    name: heavy suites
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
      - run: ./gradlew --no-daemon cyclonedxBom
      # google/osv-scanner-action v2.7.1
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932
        with:
          scan-args: -L orchestrator-backend/build/reports/sbom/jagt.cdx.json
      - name: install what the suites shell out to
        run: sudo scripts/linux-test-deps.sh
      - name: give git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "jagt ci"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('orchestrator-backend/build-logic/src/main/groovy/jagt.suites.gradle') }}
          restore-keys: playwright-
      - name: run the matrix, the drivers and the board
        run: scripts/with-linux-desktop.sh ./gradlew --no-daemon e2eTest linuxDriverTest boardTest
      - name: run the image under compose
        if: '!cancelled()'
        run: scripts/container-suite.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: heavy-test-reports
          path: |
            orchestrator-backend/build/reports/tests/e2eTest
            orchestrator-backend/build/reports/tests/linuxDriverTest
            orchestrator-backend/build/reports/tests/boardTest
            orchestrator-backend/build/reports/tests/containerTest
            /tmp/jagt-xvfb.log
            /tmp/jagt-dunst.log

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, heavy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
      - run: ./gradlew --no-daemon bootJar cyclonedxBom
      - name: name the assets after the version they are
        run: |
          version=$(./gradlew --no-daemon -q printVersion)
          mkdir -p build/release
          cp build/libs/jagt.jar "build/release/jagt-$version.jar"
          cp build/reports/sbom/jagt.cdx.json "build/release/jagt-$version.cdx.json"
          (cd build/release && sha256sum "jagt-$version.jar" "jagt-$version.cdx.json" > "jagt-$version.sha256")
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: orchestrator-backend/build/release/*.jar
      - name: attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/* --generate-notes --verify-tag
          fi
      - name: publish the image
        id: image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-image.sh "$GITHUB_REF_NAME"
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: attach the image's digest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          version=$(./gradlew --no-daemon -q printVersion)
          echo "${DIGEST#sha256:}  ghcr.io image jagt:$version" > "build/release/jagt-$version.image.sha256"
          gh release upload "$GITHUB_REF_NAME" "build/release/jagt-$version.image.sha256" --clobber
      - name: keep every patch of the last two minors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt -q '
            map(. + {minor: (.tagName | try capture("^v(?<v>[0-9]+[.][0-9]+)").v catch .)})
            | (group_by(.minor) | map({minor: .[0].minor, at: (map(.createdAt) | max)})
               | sort_by(.at) | reverse | .[:2] | map(.minor)) as $kept
            | .[] | select(.minor as $m | $kept | index($m) | not) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
