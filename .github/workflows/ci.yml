# Three groups, as docs/rules/testing-suites.md: `test` on a pull request, `heavy` on a pull request,
# `stand` per engine (compose on every run, kind on a pull request: the runner ships kind and kubectl),
# `audit` the live scans only when the dependency set changed, `install` on three systems per pull request,
# `release` on a push to main with no job before it (the request proved the tree): its first step reads
# whether the version's tag is new, every later step runs only then.
# Each Linux job runs `scripts/linux-suite.sh <job>`, the line `scripts/ci-local.sh` runs too, online; a cache only speeds it up.
# No run is timed here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'The one job to run, as on a pull request (empty: every job)'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  ORG_GRADLE_PROJECT_timed: 'false'
  JAGT_CI_IMAGE: ghcr.io/guldmitry/jagt-ci:base@sha256:cd26fe6946fa84b5e819c3df3b6b4c96581c7fc30badcca9d562d77fcc8a4e85

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: orchestrator-backend

jobs:
  test:
    name: unit + functional
    if: github.event_name != 'push' && (!inputs.job || inputs.job == 'test')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml', 'board/package-lock.json') }}
      - name: run the unit and functional suites in the CI image
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: unit-test-report
          retention-days: 14
          path: orchestrator-backend/build/linux-suite

  heavy:
    name: heavy suites
    if: github.event_name != 'push' && (!inputs.job || inputs.job == 'heavy')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml', 'board/package-lock.json') }}
      - name: run the matrix, the drivers, the board and the image under compose in the CI image
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh heavy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: heavy-test-reports
          retention-days: 14
          path: orchestrator-backend/build/linux-suite

  stand:
    name: stand (${{ matrix.engine }})
    if: github.event_name != 'push' && (!inputs.job || inputs.job == 'stand')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ github.event_name != 'push' && fromJSON('["compose","kind"]') || fromJSON('["compose"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to the registry holding the CI image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gradle-home
          key: gradle-home-${{ github.job }}-${{ matrix.engine }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml', 'board/package-lock.json') }}
      - name: run the stand without a model on compose in the CI image
        if: matrix.engine == 'compose'
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh stand
      - name: run the stand without a model on kind in the CI image
        if: matrix.engine == 'kind'
        env:
          JAGT_GRADLE_CACHE: ${{ runner.temp }}/gradle-home
        run: scripts/linux-suite.sh stand-kind
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: stand-${{ matrix.engine }}-evidence
          retention-days: 14
          path: orchestrator-backend/build/linux-suite

  audit:
    name: dependency audit
    if: (!inputs.job || inputs.job == 'audit')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board/package-lock.json
      - run: ./gradlew --no-daemon gateScan -Paudit.base="$AUDIT_BASE"

  install:
    name: install (${{ matrix.os }})
    if: github.event_name != 'push' && (!inputs.job || inputs.job == 'install')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml') }}
      - name: install, upgrade and stop against a fake release feed
        run: ./gradlew --no-daemon gateInstall
        shell: bash

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      pages: write
      deployments: write
      id-token: write
      attestations: write
      actions: read
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle/*.versions.toml', '**/gradle.lockfile', 'orchestrator-backend/gradle/verification-metadata.xml') }}
      - id: version
        name: read the version and whether its tag is new
        run: |
          tag="v$(./gradlew --no-daemon -q printVersion)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: stop unless this tree is the one the pull request proved
        if: steps.version.outputs.new == 'true'
        run: ./gradlew --no-daemon -q provenTree -Pcommit="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./gradlew --no-daemon gateRelease
        if: steps.version.outputs.new == 'true'
      - name: name the assets after the version they are
        if: steps.version.outputs.new == 'true'
        run: |
          version=$(./gradlew --no-daemon -q printVersion)
          mkdir -p build/release
          cp build/libs/jagt.jar "build/release/jagt-$version.jar"
          cp build/reports/sbom/jagt.cdx.json "build/release/jagt-$version.cdx.json"
          (cd build/release && sha256sum "jagt-$version.jar" "jagt-$version.cdx.json" > "jagt-$version.sha256")
          cp ../install.sh build/release/install.sh
          cp ../install.ps1 build/release/install.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.new == 'true'
        with:
          subject-path: |
            orchestrator-backend/build/release/*.jar
            orchestrator-backend/build/release/*.cdx.json
            orchestrator-backend/build/release/*.sha256
      - name: attach them to the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/* --clobber
          else
            gh release create "$TAG" build/release/* --generate-notes --target "$GITHUB_SHA"
          fi
      - name: publish the image
        if: steps.version.outputs.new == 'true'
        id: image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/publish-image.sh "$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.new == 'true'
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: attach the image's digest to the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version=$(./gradlew --no-daemon -q printVersion)
          echo "${DIGEST#sha256:}  ghcr.io image jagt:$version" > "build/release/jagt-$version.image.sha256"
          gh release upload "$TAG" "build/release/jagt-$version.image.sha256" --clobber
      - name: keep every patch of the last two minors
        if: steps.version.outputs.new == 'true'
        id: retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --limit 1000 --json tagName,createdAt -q '
            map(. + {minor: (.tagName | try capture("^v(?<v>[0-9]+[.][0-9]+)").v catch .)})
            | (group_by(.minor) | map({minor: .[0].minor, at: (map(.createdAt) | max)})
               | sort_by(.at) | reverse | .[:2] | map(.minor)) as $kept
            | .[] | select(.minor as $m | $kept | index($m) | not) | .tagName')
          for tag in $tags; do gh release delete "$tag" --yes; done
          echo "image-tags=$(printf '%s\n' $tags | sed 's/^v//' | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: delete the deleted releases' images
        if: steps.version.outputs.new == 'true' && steps.retention.outputs.image-tags != ''
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: ${{ github.event.repository.name }}
          delete-tags: ${{ steps.retention.outputs.image-tags }}
      - name: delete every Pages deployment but the newest
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" |
            jq -r '.[1:][] | .id' |
            while read -r id; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id"
            done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: steps.version.outputs.new == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.version.outputs.new == 'true'
        with:
          path: site

  pages:
    name: pages
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
