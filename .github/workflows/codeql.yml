# Static analysis for security on every push and pull request: CodeQL over the Gradle build and the board's JavaScript.
# A finding of severity error fails the run; the results are uploaded to code scanning either way.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.language == 'java-kotlin'
        with:
          cache-provider: basic
      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: build what CodeQL traces
        if: matrix.language == 'java-kotlin'
        working-directory: orchestrator-backend
        run: ./gradlew --no-daemon classes testClasses
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: fail on a finding of severity error
        run: |
          errors=$(jq -s '[.[] | .runs[] | . as $run | .results[]
            | (.level // $run.tool.driver.rules[.ruleIndex].defaultConfiguration.level // "warning")
            | select(. == "error")] | length' sarif-results/*.sarif)
          echo "codeql.errors=$errors"
          test "$errors" -eq 0
