name: base-images

on:
  push:
    branches: [main]
    paths: ['base/**']
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

concurrency:
  group: base-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  base:
    name: base image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: publish the image for amd64 and arm64
        id: image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: orchestrator-backend/scripts/publish-base-image.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: scan the image for known vulnerabilities
        working-directory: orchestrator-backend
        run: scripts/vulnerability-scan.sh scan image ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
