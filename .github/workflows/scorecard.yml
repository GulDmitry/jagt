# Supply-chain posture on every push to main: OpenSSF Scorecard, its results uploaded to code scanning.
name: scorecard

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: scorecard
        env:
          INPUT_REPO_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS=true -e INPUT_REPO_TOKEN -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH \
            -e GITHUB_REF -e GITHUB_REPOSITORY -e GITHUB_WORKSPACE -e GITHUB_API_URL \
            -e INPUT_RESULTS_FILE=scorecard.sarif -e INPUT_RESULTS_FORMAT=sarif \
            -e INPUT_PUBLISH_RESULTS=false -e INPUT_FILE_MODE=archive \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$GITHUB_EVENT_PATH:$GITHUB_EVENT_PATH:ro" \
            -w "$GITHUB_WORKSPACE" \
            ghcr.io/ossf/scorecard-action:v2.6.0@sha256:7f092e5a4a363af001cca6cdb04f111e212173ba602336104394e7febc2c6e48
      - uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
