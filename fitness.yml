schema: 1
extends: defaults
project:
  root: orchestrator-backend
  basePackage: dev.jagt.orchestrator
  sourceSets: all
  modules:
    statechart: { exposes: ["dev.jagt.statechart.."] }
    core: { exposes: [".."] }
    usecase: { exposes: [".."] }
    adapter: { exposes: ["dev.jagt.orchestrator.adapter.replay", "dev.jagt.orchestrator.adapter.agent.trust", "dev.jagt.orchestrator.adapter.process", "dev.jagt.orchestrator.adapter.host"] }
    surface: { exposes: [] }
    stand: { exposes: [] }
technical:
  maintainability:
    modularity:
      collaborators-per-class: { engine: archunit, set: all, kind: class, annotated: org.springframework.stereotype.Component, measure: constructor-parameters, governs: coupling, max: 5 }
      ports: { engine: archunit, kind: class, interface: true, package: "port..", governs: count, max: 58, decision: "0176" }
      single-use-indirections: { engine: archunit, set: all, kind: class, interface: true, measure: single-implementer, governs: count, max: 4, decision: "0176", hint: "an interface whose one implementer sits beside it, with no fake, is an indirection: fold it into the class; the floor only falls" }
      flag-arguments: { engine: archunit, set: all, kind: class, annotated: org.springframework.stereotype.Component, measure: flag-arguments, governs: count, max: 9, decision: "0176", hint: "a mode is a named value: an enum or two methods, never a boolean parameter; the floor only falls" }
      static-helpers-on-components: { engine: archunit, set: all, kind: class, annotated: org.springframework.stereotype.Component, measure: static-helpers, governs: count, max: 31, decision: "0176", hint: "a helper a component exposes statically belongs to a holder of its own or to the type it reads; the floor only falls" }
      gradle-modules: { engine: scan, glob: "settings.gradle,fitness/settings.gradle", regex: "(?m)^include\\s+'([^']+)'", per: match, governs: count, max: 12, decision: "0176" }
      build-logic-files: { engine: scan, glob: "build-logic/**/*.{gradle,groovy},fitness/**/*.gradle", governs: count, max: 24, decision: "0176" }
      workflow-gradle-lines: { engine: scan, set: tracked, glob: "../.github/workflows/*.yml,../.gitlab-ci.yml", per: file, regex: "\\./gradlew(?!( --[a-z-]+)* (gate\\w*|-q printVersion|-q provenTree)\\b)", governs: count, max: 0, hint: "a CI job runs one gate<Job> task, which scripts/ci-local.sh runs too (docs/rules/testing-suites.md)" }
      scripts-are-java: { engine: scan, set: tracked, glob: "../**/*.{sh,ps1,bash,py,js}", except: "../install.sh,../install.ps1,../scripts/guards/*.sh,../entrypoint.sh,../mcp_client.js,../board/**,adapter/src/main/resources/opencode/jagt-gate/index.js,gradle/stop-test-tmux.sh,scripts/container-suite.sh,scripts/container-suite/stub-agent.sh,scripts/ci-local.sh,scripts/gradle-slot.sh,scripts/linux-suite.sh,scripts/linux-test-deps.sh,scripts/publish-base-image.sh,scripts/publish-image.sh,scripts/secret-scan.sh,scripts/vulnerability-scan.sh,scripts/with-linux-desktop.sh,stand/src/main/resources/server/fake-claude.sh,stand/src/main/resources/server/fake-gh.sh,stand/src/stand/resources/flows/flows.sh", per: file, governs: count, max: 0, decision: "0227", hint: "a script with logic is Java: a build-logic task or a JUnit suite; shell only on this allow-list (ARCHITECTURE.md, the kind script)" }
      module-isolation: { engine: archunit, set: all, measure: module-isolation, governs: count, max: 0, decision: "0211" }
      spawn-owner: { engine: archunit, set: main, calls: java.lang.ProcessBuilder.start, except: "ChildProcesses,Git", governs: class-dependency, max: 0, hint: "a child process is spawned by ChildProcesses alone: its owner kills and reaps every live child at stop" }
      spawn-owner-exec: { engine: archunit, set: main, calls: java.lang.Runtime.exec, except: "ChildProcesses", governs: class-dependency, max: 0, hint: "a child process is spawned by ChildProcesses alone" }
      host-properties-owner: { engine: archunit, set: main, calls: "java.lang.System.getProperty,java.lang.Integer.getInteger,java.lang.Long.getLong,java.lang.Boolean.getBoolean", except: "SystemHost,Executables,StandInputs", governs: class-dependency, max: 0, decision: "0248", hint: "a host property (home, temp, working directory, OS) is read through Host alone; the stand reads its own -D inputs through StandInputs" }
      rings: { fitness: RingsFitness, governs: import-direction, max: 0, decision: "0162" }
      ring-sources: { fitness: RingSourcesFitness, governs: package-dependency, max: 0, decision: "0035" }
      edge-names: { fitness: EdgeNamesFitness, governs: class-dependency, max: 0, decision: "0007" }
      flow-doors: { fitness: FlowDoorsFitness, governs: class-dependency, max: 0, decision: "0144" }
      task-opening-doors: { fitness: TaskOpeningDoorsFitness, governs: class-dependency, max: 0, decision: "0066" }
      command-literals-in-surface: { fitness: CommandLiteralsFitness, governs: count, max: 0, hint: "a surface reads a verb from TaskAction or a GlobalCommand bean, never spells it" }
      role-names: { fitness: RoleNamesFitness, governs: class-dependency, max: 0, decision: "0122" }
      role-names-outside: { fitness: RoleNamesOutsideFitness, governs: class-dependency, max: 0, decision: "0203" }
      collaborator-owners: { fitness: CollaboratorOwnersFitness, governs: count, max: 0 }
      classes-per-package: { fitness: PackageCeilingFitness, governs: size, max: 10, decision: "0166" }
      package-exceptions-over-ceiling: { fitness: PackageExceptionsFitness, governs: size, min: 11, decision: "0166" }
      dependency-lines-in-build-gradle: { fitness: DependencyLinesFitness, governs: count, max: 99, decision: "0252" }
    analysability:
      ci-jobs: { fitness: CiJobsFitness, governs: count, max: 12, decision: "0244" }
      ci-triggers: { fitness: CiTriggersFitness, governs: count, max: 3, decision: "0176", hint: "push, pull request, and a dispatch that runs one job alone (owner 2026-11-24)" }
      source-sets: { fitness: SourceSetsFitness, governs: count, max: 28, decision: "0176" }
      start-triggers: { fitness: StartTriggersFitness, governs: count, max: 60, decision: "0176" }
      task-statuses: { fitness: TaskStatusesFitness, governs: count, max: 14, decision: "0176" }
      public-surface: { fitness: PublicSurfaceFitness, governs: count, max: 87, decision: "0256" }
      capabilities: { engine: archunit, kind: class, interface: false, assignableTo: "flow.capability.TaskCapability", governs: count, max: 19, decision: "0176" }
      startup-checks: { engine: archunit, kind: class, interface: false, assignableTo: "port.host.StartupCheck", governs: count, max: 34, decision: "0176" }
      reducer-zero-time: { engine: scan, set: main, glob: "**/flow/TaskReducer.java", per: file, regex: "\\b(?:step|applied|stayed|apply)\\([^;]*,\\s*0L?\\)", governs: count, max: 0, decision: "0176", hint: "a door with no time of its own sends its move through step(task, move), which refuses an effect that reads one; a door whose move lands takes now" }
      first-of-unordered-map: { engine: scan, set: main, per: line, regex: "\\.(?:values|keySet|entrySet)\\(\\)(?:\\.iterator\\(\\)\\s*\\.next\\(\\)|\\.stream\\(\\)\\s*\\.(?:findFirst|findAny)\\(\\))", governs: count, max: 2, decision: "0247", hint: "a map has no first element unless it is sequenced: pick by an ordered key list, or keep a LinkedHashMap and say which entry; the floor only falls" }
      config-file-existence: { engine: scan, set: main, except: "**/service/ConfigService.java", per: line, regex: "Files\\.exists\\((?:\\w+\\.)?configFile\\(\\)\\)", governs: count, max: 1, hint: "whether jagt.yml exists is ConfigService.fileExists(), asked by every reader; the one remaining read is the source behind it" }
      broad-catches: { engine: scan, set: main, per: line, regex: "catch \\([^)]*\\b(?:RuntimeException|Exception|Throwable)\\b", governs: count, max: 147, decision: "0250", hint: "a catch names the failure it handles: its typed exception, never a broad one; the floor only falls" }
      silent-catches: { fitness: SilentCatchFitness, governs: count, max: 205, decision: "0250", hint: "a catch logs or rethrows; one that does neither hides its cause; the floor only falls" }
      status-literals-outside-flow: { engine: scan, set: main, except: "core/**,stand/**", per: line, regex: "TaskStatus\\.[A-Z_]{2,}", governs: count, max: 22, decision: "0144", hint: "a status is compared through a FlowRules predicate; the count only falls; stand/** is exempt, its invariants observe statuses from outside as tests do" }
      vendor-words-in-core: { engine: scan, set: tracked, glob: "core/src/main/**/*.java", per: line, regex: "(?i:\\b(?:opencode|claude|codex|tmux|kitty|ghostty|macos|darwin|linux|launchd|systemd|caffeinate|osascript|libnotify|anthropic|openai)\\b)|\\bWindows\\b", governs: count, max: 0, hint: "core names no vendor and no OS, in a word as in an import: the words are the adapter's drivers; lowercase windows is English and stays; a vendor-specific name lives in the adapter" }
      roles: { engine: scan, glob: "../roles/*", kind: directory, per: name, governs: count, max: 5, decision: "0231" }
      spec-capabilities: { engine: scan, glob: "../openspec/specs/*", kind: directory, per: name, governs: count, max: 55, decision: "0241" }
      decision-lines: { engine: scan, glob: "../docs/decisions/????-*.md", per: file, measure: lines, governs: size, max: 50 }
      rule-lines: { engine: scan, glob: "../docs/rules/*.md", per: file, measure: lines, governs: size, max: 100 }
      # each exception ends when its class is cut to 1000 lines or less, at a cut of its own
      class-lines: { engine: scan, set: all, per: file, measure: lines, except: &classLinesExcepted "", governs: size, max: 1000, decision: "0228", hint: "a class past 1000 lines does more than one thing: cut it by responsibility" }
      class-lines-stale-exceptions: { engine: scan, set: all, glob: *classLinesExcepted, per: file, measure: lines, governs: size, min: 1001, decision: "0228", hint: "an excepted class at or under 1000 lines: delete its name from class-lines" }
      page-lines: { engine: scan, glob: "../AGENTS.md,../README.md,../docs/decisions/README.md,../docs/*.md,../docs/features/*.md,../openspec/specs/*/spec.md", per: file, measure: lines, governs: size, max: 200 }
      session-brief-step-lines: { engine: scan, glob: "../roles/session/brief.md.dist", per: section, measure: lines, regex: "(?m)^## [a-z][a-z0-9-]*$", governs: size, max: 200, hint: "a prompt: compress it, then run promptEval and roleEval -Prole=master (docs/rules/testing.md)" }
      map-lines: { engine: scan, glob: "../ARCHITECTURE.md", per: file, measure: lines, governs: size, max: 500 }
      line-characters: { engine: scan, glob: "../AGENTS.md,../README.md,../docs/decisions/README.md,../docs/*.md,../docs/features/*.md,../openspec/specs/*/spec.md,../docs/decisions/????-*.md,../docs/rules/*.md,../ARCHITECTURE.md,../roles/session/brief.md.dist", per: line, measure: characters, regex: "^[^|]", governs: size, max: 150 }
      sentence-words: { engine: scan, glob: "../docs/rules/*.md,../openspec/specs/*/spec.md,../AGENTS.md", per: sentence, measure: words, governs: size, max: 25 }
      session-brief-sentence-words: { engine: scan, glob: "../roles/session/brief.md.dist", per: sentence, measure: words, governs: size, max: 25, hint: "a prompt: compress it, then run promptEval and roleEval -Prole=master (docs/rules/testing.md)" }
      rule-docs: { engine: scan, glob: "../docs/rules/*.md", per: name, governs: count, max: 9, decision: "0176" }
      left-for-later-markers: { engine: scan, set: tracked, per: file, regex: "\\b(TO[D]O|FIXM[E]|XX[X])\\b", governs: count, max: 7 }
      blank-normalisation-copies: { engine: scan, set: main, except: "**/task/text/Blank.java", per: line, regex: "[Bb]lank\\(\\w*\\)? \\? null|isBlank\\(\\) \\? null", governs: count, max: 0, decision: "0253", hint: "a blank text reads as absent through Blank.toNull (Wire.absent for a message): one rule, never a copy" }
      web-link-rule-copies: { engine: scan, set: main, per: file, regex: "startsWith\\(\"https?://\"\\)", governs: count, max: 1, decision: "0253", hint: "what counts as a web link is Wire.webLink alone" }
      uncopied-record-lists: { engine: scan, set: main, per: match, regex: "(\\w+) = \\1 == null \\? (?:List|Map|Set)\\.of\\(\\) : \\1;", governs: count, max: 0, decision: "0253", hint: "a record copies the list it is given (List.copyOf), so a caller's later change never reaches it" }
      duplicate-simple-names: { engine: archunit, set: main, measure: duplicate-simple-names, governs: count, max: 2, decision: "0253", hint: "two top-level classes of one simple name shadow each other at every import: name the second for what it holds; the floor only falls" }
      home-paths: { engine: scan, set: tracked, per: file, machine: paths, governs: count, max: 0 }
      cited-line-numbers: { engine: scan, set: tracked, per: file, regex: "\\b[Ll]ines? [0-9]+\\b|\\.(java|md|gradle|yml):[0-9]+\\b|#L[0-9]+\\b", except: "**/board/vendor/**,src/test/resources/archunit/**,**/recordings/**", governs: count, max: 0 }
      ide-names: { engine: scan, glob: "**/*.{java,js,sh,gradle,groovy,yml},../board/**/*.js,../.github/**/*.yml,../.gitlab-ci.yml", except: "../fitness.yml,**/node_modules/**", per: file, regex: "\\bIDEs?\\b|\\bIde[A-Z]|Intell[i]J|VS ?Cod[e]", governs: count, max: 0, hint: "jagt has no IDE concept: name a code viewer or a diff viewer" }
      hook-path-from-project-dir: { engine: scan, glob: "../.claude/settings.json", per: line, regex: "\\$\\(git rev-parse --show-toplevel\\)", governs: count, max: 0, hint: "a hook finds its script from $CLAUDE_PROJECT_DIR: the cwd may be another repository, where the script is missing and the guard never runs" }
      board-hidden-wins: { engine: scan, glob: "../board/app.css", per: file, regex: "(?m)^\\[hidden\\] \\{\\n  display: none !important;", governs: count, min: 1, hint: "a [hidden] element stays hidden whatever display another rule gives it" }
      board-hidden-per-selector: { engine: scan, glob: "../board/**/*.css", except: "../board/vendor/**,../board/node_modules/**", per: line, regex: "\\S\\[hidden\\]", governs: count, max: 0, hint: "the one [hidden] rule in app.css already wins over every display: a per-selector copy restates it" }
      css-hex-outside-root: { engine: scan, glob: "../board/app.css", per: line, regex: "^(?!  --[\\w-]+: light-dark\\().*#[0-9a-fA-F]{3,8}\\b", governs: count, max: 0, decision: "0176", hint: "a colour is a token defined once in :root as light-dark(); a rule uses var(--token), never a hex" }
      css-keyframes: { engine: scan, glob: "../board/app.css", per: match, regex: "(@keyframes)", governs: count, max: 1, decision: "0176", hint: "the checks ring's pulse is the board's one animation (docs/rules/design.md)" }
      css-tokens: { engine: scan, glob: "../board/app.css", per: match, regex: "(?m)^  (--[\\w-]+): light-dark\\(", governs: count, max: 14, decision: "0176", hint: "a colour token is a meaning (docs/rules/design.md): a fifteenth means a meaning that exists under another name" }
      board-timers: { engine: scan, glob: "../board/**/*.js", except: "../board/vendor/**,../board/node_modules/**", per: match, regex: "\\b(setInterval)\\(", governs: count, max: 3, decision: "0176", hint: "the board is pushed, not polled: a timer is named in the board spec's Three timers requirement, and the number only falls" }
      shutdown-phase-bounded: { engine: scan, glob: "src/main/resources/application.yml", per: file, regex: "(?m)^\\s+timeout-per-shutdown-phase: 20s$", governs: count, min: 1, hint: "the shutdown spec names the 20 s phase bound" }
      editor-launcher-not-a-default: { engine: scan, glob: "src/main/resources/application.yml", per: file, regex: "(?m)^ *editor(-diff)?-command:\\s*\\[\\s*[^\\s\\]]", governs: count, max: 0, hint: "no editor is a default: an uncommented editor-command in application.yml stays empty" }
      suite-stats-reads-no-other-project: { engine: scan, glob: "build-logic/src/main/groovy/jagt.suite-stats.gradle", per: file, regex: "provider\\s*\\{\\s*allprojects", governs: count, max: 0 }
      spotless-push-hook-off: { engine: scan, glob: "build-logic/src/main/groovy/jagt.conventions.gradle", per: file, regex: "tasks\\.named\\('spotlessInstallGitPrePushHook'\\)\\s*\\{\\s*enabled = false", governs: count, min: 1 }
      suite-temp-roots-removed: { engine: scan, glob: "build-logic/src/main/groovy/jagt.suites.gradle", per: file, regex: "finalizedBy removal", governs: count, min: 1, hint: "boardTest and e2eTest keep their temp roots in the task scratch folder and a finalizing task removes it, so no run leaves a root behind" }
      release-not-on-tag-push: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "tags:\\s*\\[", governs: count, max: 0, hint: "the release job runs on a push to main; nobody pushes a tag" }
      release-checks-tag-is-new: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "git ls-remote --exit-code --tags origin", governs: count, min: 1, hint: "release publishes only when the version's tag does not exist yet" }
      release-needs-no-stand-or-install: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "(?m)^    needs: \\[[^\\]]*\\b(stand|install)\\b", governs: count, max: 0, decision: "0233", hint: "main publishes the tree the pull request proved; the stand and install do not re-run there (docs/rules/ci.md)" }
      release-runs-only-when-tag-new: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "steps\\.version\\.outputs\\.new == 'true'", governs: count, min: 1, hint: "release publishes only when the version's tag does not exist yet" }
      pages-deployments-pruned-by-age: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "jq -r '\\.\\[1:\\]\\[\\] \\| \\.id'", governs: count, min: 1, hint: "a Pages deployment carries ref main, so all but the newest go, never matched by tag name" }
      ci-no-retry: { engine: scan, glob: "../.github/workflows/ci.yml,../.github/workflows/nightly.yml", per: file, regex: "continue-on-error|retry|rerun-failed|re-run-failed", governs: count, max: 0, decision: "0233", hint: "a CI red is never rerun or tolerated: fix the local run (docs/rules/ci.md)" }
      ci-per-push-reads-no-live-scan: { engine: scan, glob: "build-logic/src/main/groovy/jagt.suites.gradle", per: file, regex: "gate(Test|Heavy): \\[[^\\]]*'(vulnerabilityScan|boardAudit)'|npm ci && npm audit[^']*&& npm run", governs: count, max: 0, decision: "0233", hint: "npm audit and the osv scan run in gateScan, nightly or on a dependency diff, never in the per-push test or heavy gate (docs/rules/ci.md)" }
      ci-no-time-flags: { engine: scan, glob: "../.github/workflows/ci.yml,../.github/workflows/nightly.yml", per: file, regex: "-Pbudgets|-PrunMinutes", governs: count, max: 0, decision: "0233", hint: "CI has no time ceiling, measurement or stop; only a job timeout (docs/rules/ci.md)" }
      ci-no-package-install: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "linux-test-deps|\\bapt(-get)?\\b", governs: count, max: 0, decision: "0233", hint: "a CI job installs nothing: the package belongs in base/Dockerfile.ci (docs/rules/ci.md)" }
      ci-image-pinned-by-digest: { engine: scan, glob: "../.github/workflows/ci.yml", per: file, regex: "(?m)^\\s+(?:image|JAGT_CI_IMAGE): (?!\\S+@sha256:[0-9a-f]{64}$)", governs: count, max: 0, decision: "0233", hint: "the CI image is pinned by digest (docs/rules/ci.md)" }
      ci-no-sleep: { engine: scan, glob: "../.github/workflows/ci.yml,../.github/workflows/nightly.yml", per: file, regex: "\\bsleep\\b", governs: count, max: 0, decision: "0233", hint: "a wait in CI is a hang guard, never a shell sleep (docs/rules/ci.md)" }
      nightly-calls-no-pull-request-job: { engine: scan, glob: "../.github/workflows/nightly.yml", per: file, regex: "uses:\\s*\\./\\.github/workflows/ci\\.yml", governs: count, max: 0, decision: "0233", hint: "the nightly runs only what the local gate cannot: it never calls ci.yml (docs/rules/ci.md rule 10)" }
      rules-without-check: { engine: scan, glob: "../docs/rules/*.md", per: file, regex: "none yet", governs: count, max: 0, hint: "a rule names the check that holds it; none yet is a gap (docs/rules/ci.md)" }
      nightly-dispatchable: { engine: scan, glob: "../.github/workflows/nightly.yml", per: file, regex: "(?m)^  workflow_dispatch:", governs: count, min: 1, hint: "the nightly can be started by hand" }
      skill-lines: { engine: scan, glob: "../.claude/skills/*/SKILL.md", per: file, measure: lines, governs: size, max: 500, hint: "a skill file: split into files one level deep (platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices)" }
      skill-name: { engine: scan, glob: "../.claude/skills/*/SKILL.md,../.claude/agents/*.md", per: file, regex: "(?sm)\\A(?!---\\n(?:(?!^---).)*?^name: [a-z0-9-]{1,64}$)", governs: count, max: 0, hint: "frontmatter name: lowercase letters, digits and hyphens, at most 64 characters" }
      skill-description: { engine: scan, glob: "../.claude/skills/*/SKILL.md,../.claude/agents/*.md", per: file, regex: "(?sm)\\A(?!---\\n(?:(?!^---).)*?^description: *(?:[^\\s>|]|[>|][-+]?\\s*\\n\\s+\\S))", governs: count, max: 0, hint: "frontmatter description: present and not empty" }
      skill-description-characters: { engine: scan, glob: "../.claude/skills/*/SKILL.md,../.claude/agents/*.md", per: file, regex: "(?sm)\\A---\\n(?:(?!^---).)*?^description: (?:[^\\n]|\\n(?=[ \\t])){1025,}", governs: count, max: 0, hint: "frontmatter description: at most 1024 characters" }
      skill-links-resolve: { engine: scan, glob: "../.claude/skills/*/SKILL.md,../.claude/skills/*/*.md,../.claude/rules/*.md", per: link, measure: unresolved, governs: count, max: 0 }
      skill-references-one-level: { engine: scan, glob: "../.claude/skills/*/SKILL.md", per: link, measure: nested, governs: count, max: 0, hint: "a file a skill links links no further file of the skill" }
      agent-lines: { engine: scan, glob: "../.claude/agents/*.md", per: file, measure: lines, governs: size, max: 200 }
      rule-pointer-lines: { engine: scan, glob: "../.claude/rules/*.md", per: file, regex: "(?s)\\A---\\n.*?\\n---\\n(?:[^\\n]*\\n){6,}", governs: count, max: 0, hint: "a rule pointer: its body is a link of five lines at most, its rule lives in docs/rules" }
    modifiability:
      constructors-called-from-main: { fitness: ConstructorsCalledFromMainFitness, governs: count, max: 0 }
      members-called-from-main: { fitness: MembersCalledFromMainFitness, governs: count, max: 0 }
      wither-defects: { fitness: WitherDefectsFitness, governs: count, max: 0 }
      wither-count: { fitness: WitherCountFitness, governs: count, min: 81 }
      guard-is-the-statecharts: { engine: scan, set: all, glob: "**/*Guard.java", except: "**/flow/**,**/dev/jagt/statechart/**", per: name, governs: count, max: 0, hint: "guard is the statechart's transition condition (flow/, dev.jagt.statechart): name a precondition, a check or a boundary (docs/rules/glossary.md)" }
    testability:
      autowired-fields: { engine: archunit, set: all, kind: field, annotated: org.springframework.beans.factory.annotation.Autowired, governs: annotation, max: 0 }
      static-state: { engine: archunit, set: all, kind: field, static: true, mutable: true, except: "TaskAliasLogFilter,AbortedConnectionFilter", governs: count, max: 0 }
      post-construct-hooks: { engine: archunit, set: all, kind: method, annotated: jakarta.annotation.PostConstruct, except: AbortedConnectionFilter, governs: annotation, max: 0 }
      # StandClockTest reads real time (0055)
      no-system-current-time-millis: { engine: archunit, set: &clockSet all, calls: java.lang.System.currentTimeMillis, except: &clockExcept "RuntimeWiring,StandClock,EvalStats,BoardActionsTest,BoardCardTest,BoardConnectionTest,BoardHeaderAndFiltersTest,BoardInteractionLogTest,BoardPageContext,BreakableJob,BoardPopupsAndTabsTest,BoardReportsTest,BoardWorkspaceTest,E2eWorkspace,MasterModeFlowTest,Stalled,StandClockTest,FakeOidcProvider,HotSpotsTask", governs: class-dependency, max: 0 }
      no-clock-system-utc: { engine: archunit, set: *clockSet, calls: java.time.Clock.systemUTC, except: *clockExcept, governs: class-dependency, max: 0 }
      no-clock-system: { engine: archunit, set: *clockSet, calls: java.time.Clock.system, except: *clockExcept, governs: class-dependency, max: 0 }
      test-builder-branches: { engine: scan, set: all, glob: "**/Test*Builder.java", regex: "\\b(if|for|while|switch)\\s*\\(|\\bdo\\s*\\{|\\s\\?\\s", governs: count, max: 0 }
      test-builder-calls: { fitness: TestBuilderCallsFitness, governs: count, max: 0 }
      test-builder-wiring: { fitness: TestBuilderWiringFitness, governs: count, max: 0 }
      test-helper-methods: { fitness: TestHelperMethodsFitness, governs: count, max: 0 }
      test-root-kinds: { fitness: TestRootKindsFitness, governs: count, max: 0 }
      test-naming: { fitness: TestNamingFitness, governs: count, max: 0 }
      log-capture: { fitness: LogCaptureFitness, governs: class-dependency, max: 0 }
      suites-tap-nobody: { fitness: SuitesTapNobodyFitness, governs: count, max: 0, decision: "0058" }
      timing-in-tests: { engine: scan, glob: "**/src/{test,testFixtures,boardTest,e2e,stand,installTest,linuxTest,evalSupport,acceptanceEval,codeReviewEval,masterEval,promptEval,triageEval}/**/*.java", per: line, regex: "^(?!import ).*(@Timeout\\b|assertTimeout|Thread\\.sleep|new Thread\\(|Thread\\.ofPlatform|Thread\\.ofVirtual|startVirtualThread|\\bExecutorService\\b|\\bExecutors\\.|CompletableFuture(?!\\.completedFuture))", governs: count, max: 0, decision: "0237", hint: "a test has no timeout, no sleep and no thread of its own, and no line is exempt: rewrite it against a fake clock, a fake process or a synchronous executor, or delete the test (docs/decisions/0237)" }
      sleep-in-tests: { engine: scan, set: test, per: file, regex: "Thread\\.sleep\\(|TimeUnit\\.[A-Z]+\\.sleep\\(", governs: count, max: 0 }
      sleep-in-main: { engine: scan, set: main, per: line, regex: "^(?!\\s*//)(?!import ).*(Thread\\.sleep\\(|TimeUnit\\.[A-Z]+\\.sleep\\()", governs: count, max: 4, decision: "0239", hint: "main waits on an event or a condition, never a sleep; the count only falls, an exception row names a decision holding the owner's and a reviewer's agreement (docs/decisions/0239)" }
      wait-literal-in-tests: { engine: scan, set: test, per: file, regex: "\\.(atMost|within|timeout)\\(\\s*(Duration\\.of|\\d)", governs: count, max: 0, decision: "0233", hint: "a wait is a hang guard: use the source set's one wait ceiling constant, never a literal duration (docs/rules/ci.md rule 8)" }
      context-booting-tests: { engine: scan, set: test, regex: "(?m)^import org\\.springframework\\.boot\\.(test\\.context\\.SpringBootTest|builder\\.SpringApplicationBuilder);", governs: count, max: 13, decision: "0187" }
