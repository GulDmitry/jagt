change:
  src/main/java/Customers.java: |
    class Customers {
        private final OrderRepository repository;
        Customers(OrderRepository repository) { this.repository = repository; }
        List<String> of(List<String> numbers) {
            List<String> customers = new ArrayList<>();
            for (String number : numbers) {
                customers.add(repository.findByNumber(number).customer());
            }
            return customers;
        }
    }
