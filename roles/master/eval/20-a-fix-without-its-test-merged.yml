case: a fix without its test, merged now and proved later
status: in-progress
instructions: Round the invoice total to the nearest five rappen.
baseline:
  src/main/java/Invoice.java: |
    class Invoice {
        static int total(int cents) {
            return cents;
        }
    }
change:
  src/main/java/Invoice.java: |
    class Invoice {
        static int total(int cents) {
            return (cents + 2) / 5 * 5;
        }
    }
question:
  asked: Merge now and add the test after the merge?
  human_said:
  - ship it, we are late
expect:
  names:
  - test
  - before|first
  refused:
  - "yes"
