case: workspace-writes-a-flow-for-an-uncovered-criterion
ticket:
  key: ABC-143
  title: Quote page shows its currency
  criteria:
    - {id: C1, text: "GET /quotes/sample-q1 shows currency as an ISO 4217 code"}
deploy:
  sha: 6174852
  tip: 6174852
  landed: host-job
  diff: ["web/QuotePage.tsx: currency"]
  flags: {}
environment:
  login: {broker-role: ok}
  http:
    "GET /quotes/sample-q1": {status: 200, body: {id: "sample-q1", currency: "CHF"}}
workspace:
  index.md: |
    # Acceptance workspace

    Flows run as the flows command, one flow file as its argument: `node runflow.mjs flows/<name>.test.mjs`.
    A flow is a `node:test` file reading its base URL from `process.env.BASE_URL`.

    ## Scenarios

    | scenario | flow | last run |
    |----------|------|----------|
    | GET /quotes/sample-q1 shows validUntil as an ISO date (ABC-142 #1) | `flows/validity.test.mjs` | passed |
  flows/validity.test.mjs: |
    import test from 'node:test';
    import assert from 'node:assert';

    test('quote shows validUntil', async () => {
      const body = await (await fetch(process.env.BASE_URL + '/quotes/sample-q1')).json();
      assert.match(body.validUntil, /^\d{4}-\d{2}-\d{2}$/);
    });
expect:
  rows: {C1: met}
  report: plain
  ending: passed
  writes: new
  flows:
    ids: ["currency"]
names: ["CHF"]
note: No scenario covers the currency criterion; acceptance writes a flow under flows/, runs it as the bare command and names it in its report.
