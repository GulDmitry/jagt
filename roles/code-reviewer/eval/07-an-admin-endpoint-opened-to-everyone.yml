case: an admin endpoint opened to everyone
description: |
  Make the health summary reachable for the monitoring probe.
diff: |
  diff --git a/src/main/java/app/web/SecurityConfig.java b/src/main/java/app/web/SecurityConfig.java
  --- a/src/main/java/app/web/SecurityConfig.java
  +++ b/src/main/java/app/web/SecurityConfig.java
  @@ -22,6 +22,6 @@ public class SecurityConfig {
       http.authorizeHttpRequests(auth -> auth
  -        .requestMatchers("/admin/**").hasRole("ADMIN")
  +        .requestMatchers("/admin/**").permitAll()
           .anyRequest().authenticated());
       return http.build();
     }
expect:
  verdict: findings
  findings:
    - file: SecurityConfig.java
      pattern: "permitAll|authori[sz]ation|authenticat|admin|access control|open"
      severity: [blocking]
